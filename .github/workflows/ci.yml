name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9.15.0'

jobs:
  quality:
    name: Format · Typecheck · Test · Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          # Puppeteer (S8-lite) télécharge Chromium au postinstall. La CI n'a besoin
          # que du typecheck/tests ; le PDF réel se génère en dev/prod. On skip 80MB de download.
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
        env:
          # Env de test minimale — pas de vraies connexions requises pour les unitaires S0.
          NODE_ENV: test

      - name: Build
        run: pnpm build
        env:
          # Variables factices pour permettre `next build` sans backend réel.
          NEXT_PUBLIC_API_URL: http://localhost:3001
