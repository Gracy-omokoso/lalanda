name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# (S22e) Sans bloc `permissions`, le GITHUB_TOKEN hérite du défaut du dépôt ou de
# l'organisation — historiquement en écriture sur tous les scopes. Ce workflow
# exécute `pnpm install`, donc les scripts `postinstall` de 827 dépendances : un
# paquet compromis disposerait de ce jeton. La CI n'écrit rien, elle lit.
permissions:
  contents: read

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9.15.0'
  MONGO_IMAGE: 'mongo:7.0'
  # Épinglés, pas `:latest` : un run de CI doit être reproductible, et une image
  # qui bouge sous les pieds transforme une régression amont en « échec
  # mystérieux » sur un commit qui n'a rien changé.
  MINIO_IMAGE: 'minio/minio:RELEASE.2025-04-22T22-12-26Z'
  MC_IMAGE: 'minio/mc:RELEASE.2025-04-16T18-13-26Z'
  # Base dédiée aux tests — jamais `lalanda`, pour qu'un run de CI ne puisse pas
  # écrire dans une base applicative si l'URI venait à pointer ailleurs.
  MONGODB_DB: 'lalanda_ci'

jobs:
  quality:
    name: Format · Typecheck · Test · Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          # Puppeteer (S8-lite) télécharge Chromium au postinstall. La CI n'a besoin
          # que du typecheck/tests ; le PDF réel se génère en dev/prod. On skip 80MB de download.
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Check formatting
        run: pnpm format:check

      # (S22e, docs/17 § Application « dépendances surveillées ») Aucun scan de
      # dépendances n'existait : rien n'échouait jamais sur une CVE. Cliquet et
      # non seuil absolu — voir l'en-tête de scripts/audit-dependencies.mjs pour
      # le raisonnement et scripts/audit-baseline.json pour la dette gelée.
      - name: Audit des dépendances (cliquet)
        run: node scripts/audit-dependencies.mjs

      - name: Typecheck
        run: pnpm typecheck

      # Les tests e2e ont besoin d'un replica set : le code ouvre des transactions
      # Mongoose (ADR-0004), indisponibles sur un mongod autonome. Un `services:`
      # GitHub Actions ne permet pas de passer `--replSet` (aucune surcharge de la
      # commande du conteneur) ni de lancer `rs.initiate` — on démarre donc le
      # conteneur à la main, en miroir de `docker-compose.yml`.
      - name: Démarrer MongoDB (replica set rs0 — ADR-0004)
        run: |
          set -euo pipefail

          docker run -d --name lalanda-ci-mongo -p 27017:27017 "$MONGO_IMAGE" \
            --replSet rs0 --bind_ip_all --port 27017

          echo "Attente de la disponibilité de mongod…"
          for i in $(seq 1 60); do
            if docker exec lalanda-ci-mongo mongosh --quiet \
                 --eval 'db.adminCommand({ ping: 1 }).ok' >/dev/null 2>&1; then
              echo "mongod répond (tentative $i)."
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::mongod n'a pas démarré en 120 s."
              docker logs lalanda-ci-mongo || true
              exit 1
            fi
            sleep 2
          done

          # Membre déclaré sur localhost:27017 : c'est l'adresse que le runner
          # utilise, et `directConnection=true` évite toute redécouverte de
          # topologie sur un hostname qu'il ne saurait pas résoudre.
          docker exec lalanda-ci-mongo mongosh --quiet --eval '
            rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "localhost:27017" }] })
          '

          echo "Attente de l'élection du primaire…"
          for i in $(seq 1 60); do
            if docker exec lalanda-ci-mongo mongosh --quiet \
                 --eval 'db.hello().isWritablePrimary' 2>/dev/null | grep -qx true; then
              echo "Replica set rs0 prêt (tentative $i)."
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::Aucun primaire élu après 120 s."
              docker exec lalanda-ci-mongo mongosh --quiet --eval 'rs.status()' || true
              exit 1
            fi
            sleep 2
          done

          # Garde-fou : sans transactions, les e2e échoueraient avec un message
          # obscur. On le vérifie ici, une fois, explicitement.
          docker exec lalanda-ci-mongo mongosh --quiet --eval '
            const s = db.getMongo().startSession();
            s.startTransaction();
            s.getDatabase("'"$MONGODB_DB"'").ci_probe.insertOne({ ok: 1 });
            s.commitTransaction();
            s.endSession();
            print("Transactions opérationnelles.");
          '

      # MinIO — stockage objet des photos de profil (S22k). Sans lui, les six cas
      # de `avatar.e2e.test.ts` qui écrivent RÉELLEMENT dans un bucket se
      # sautaient, et l'étape de vérification suivante faisait échouer le job :
      # c'est elle qui a révélé le trou, exactement comme prévu.
      #
      # Démarré à la main plutôt qu'en `services:`, en miroir de MongoDB et de
      # `docker-compose.yml` : les buckets doivent exister avant les tests, ce
      # qu'un `services:` ne sait pas faire.
      - name: Démarrer MinIO et créer les buckets
        run: |
          set -euo pipefail

          docker run -d --name lalanda-ci-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=lalanda \
            -e MINIO_ROOT_PASSWORD=lalanda-dev-secret \
            "$MINIO_IMAGE" server /data

          echo "Attente de la disponibilité de MinIO…"
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:9000/minio/health/live >/dev/null 2>&1; then
              echo "MinIO répond (tentative $i)."
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::MinIO n'a pas démarré en 120 s."
              docker logs lalanda-ci-minio || true
              exit 1
            fi
            sleep 2
          done

          # `--network host` : le client parle au MinIO publié sur le runner,
          # sans réseau Docker dédié à créer pour trois commandes.
          #
          # `--entrypoint sh` est OBLIGATOIRE : l'image `minio/mc` a `mc` pour
          # point d'entrée, donc sans cette surcharge le `sh -c` ci-dessous est
          # passé EN ARGUMENT à `mc`, qui répond « `sh` is not a recognized
          # command » et sort en 1. `docker-compose.yml` fait la même surcharge.
          docker run --rm --network host --entrypoint sh "$MC_IMAGE" -c '
            set -e
            mc alias set ci http://localhost:9000 lalanda lalanda-dev-secret
            mc mb --ignore-existing ci/lalanda-ci-uploads
            mc mb --ignore-existing ci/lalanda-ci-exports
            mc mb --ignore-existing ci/lalanda-ci-snapshots
            echo "Buckets de CI prêts."
          '

      - name: Test
        run: pnpm test
        env:
          NODE_ENV: test
          LOG_LEVEL: error
          # Fait échouer toute suite e2e qui tenterait de se skipper (voir
          # apps/api/src/__tests__/e2e-utils.ts) et active le rapport JSON
          # consommé par l'étape de vérification suivante.
          LALANDA_REQUIRE_E2E: '1'
          MONGODB_URI: mongodb://localhost:27017/${{ env.MONGODB_DB }}?replicaSet=rs0&directConnection=true
          MONGODB_DB: ${{ env.MONGODB_DB }}
          # Secrets FACTICES, valides uniquement pour la CI : aucun service externe
          # n'est appelé par les tests. AUTH_SECRET doit faire ≥ 32 caractères
          # (packages/shared/src/env).
          AUTH_SECRET: ci-secret-non-production-0123456789abcdef
          AUTH_URL: http://localhost:3000
          AUTH_REQUIRE_EMAIL_VERIFICATION: 'false'
          API_URL: http://localhost:3001
          WEB_URL: http://localhost:3000
          # Clé maîtresse du coffre (S21b — ADR-0013). Décode vers 32 octets, et
          # la valeur décodée dit ce qu'elle est : « CI-CLE-FACTICE-NON-PRODUCTION-32 ».
          # Aucune vraie clé, même de test, n'entre dans ce dépôt.
          SECRETS_MASTER_KEY: Q0ktQ0xFLUZBQ1RJQ0UtTk9OLVBST0RVQ1RJT04tMzI=
          SECRETS_MASTER_KEY_ID: ci-k1
          # Stockage objet (S22k). Identifiants FACTICES du MinIO démarré plus
          # haut, jamais un service externe. Buckets préfixés `lalanda-ci-` pour
          # la même raison que `MONGODB_DB: lalanda_ci` : si l'endpoint venait à
          # pointer ailleurs, la CI n'écrirait pas dans des buckets applicatifs.
          S3_ENDPOINT: http://localhost:9000
          S3_REGION: us-east-1
          S3_ACCESS_KEY: lalanda
          S3_SECRET_KEY: lalanda-dev-secret
          S3_BUCKET_UPLOADS: lalanda-ci-uploads
          S3_BUCKET_EXPORTS: lalanda-ci-exports
          S3_BUCKET_SNAPSHOTS: lalanda-ci-snapshots
          # MinIO n'expose pas de DNS par bucket : sans ceci, le client construit
          # `http://lalanda-ci-uploads.localhost:9000` et toutes les écritures
          # échouent sur une résolution DNS.
          S3_FORCE_PATH_STYLE: 'true'
          # OPENAI_API_KEY est volontairement ABSENTE depuis S21b : la variable est
          # devenue un secours optionnel (ADR-0013 option C), et sa présence ferait
          # remonter `source: "env"` dans les vues d'intégration. Les suites qui
          # couvrent ce chemin de secours la posent elles-mêmes, le temps du test.

      # Preuve que le job n'est pas « vert parce que skippé » : échoue si une
      # suite e2e n'a pas réellement tourné.
      - name: Vérifier l'exécution réelle des e2e
        run: node scripts/verify-e2e-executed.mjs

      - name: Journaux MongoDB (si échec)
        if: failure()
        run: docker logs lalanda-ci-mongo || true

      - name: Build
        run: pnpm build
        env:
          # Variables factices pour permettre `next build` sans backend réel.
          NEXT_PUBLIC_API_URL: http://localhost:3001
