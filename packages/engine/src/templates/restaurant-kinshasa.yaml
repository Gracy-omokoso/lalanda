# Template sectoriel : restaurant à Kinshasa (S6-lite).
#
# Portée : moyennes mensuelles sur un exercice type. Pas de mensualisation par mois
# distinct (arrive en S7 avec l'extension DSL — voir brief §7).
# Fiscalité : IBP SYSCOHADA/RDC 30 % (attesté brief §7). TVA 16 % RDC sera modélisée
# séparément quand le ParameterPack cd-2026 arrivera (S7).
# Défauts calibrés pour un restaurant type de 40 places à Gombe (brief §7).

slug: restaurant-kinshasa
version: 1.0.0
secteur: restauration
pays: [CD]
devise_base: USD
horizon_mois: 12
# S18a (FIN-001) : horizon 5 exercices (docs/07 « horizon standard : 5 exercices »).
horizon_projection_annees: 5

# ─── Immobilisations amortissables (S14c, activées S18a) ──────
# Le total des `montant_ht` est calé sur le défaut de `investissements_initiaux`
# (30 000 USD) pour que la base amortissable et le bilan restent cohérents.
# Durées : catégories SYSCOHADA révisé — voir amortissements/index.ts.
# Acquisition au 1er janvier → prorata temporis de 12/12 sur l'exercice 1.
immobilisations:
  - label: 'Matériel et outillage de cuisine'
    categorie: materiel_outillage
    montant_ht: 15000
    date_acquisition: '2026-01-01'
  - label: 'Aménagements de la salle et de la cuisine'
    categorie: amenagements
    montant_ht: 9000
    date_acquisition: '2026-01-01'
  - label: 'Mobilier de salle'
    categorie: mobilier_bureau
    montant_ht: 4000
    date_acquisition: '2026-01-01'
  - label: 'Caisse enregistreuse et informatique'
    categorie: materiel_informatique
    montant_ht: 2000
    date_acquisition: '2026-01-01'

# ─── États financiers prévisionnels (S18a, FIN-001) ───────────
# Active les feuilles `bilan`, `caf`, `seuil_rentabilite` et le BFR détaillé
# (`pf_bfr_*`). Ce bloc ne fait que désigner des lignes et des drivers déjà
# déclarés ci-dessous ; toutes les autres clés prennent leur valeur par défaut.
structure_financiere:
  achats_variables_mensuels: cout_matiere
  charges_fixes_mensuelles: charges_operationnelles

groupes_hypotheses:
  - id: activite
    label: 'Activité'
  - id: couts_variables
    label: 'Coûts variables'
  - id: charges_fixes
    label: 'Charges fixes'
  - id: fiscalite
    label: 'Fiscalité'
  - id: financement
    label: 'Financement'

drivers:
  - id: couverts_jour
    groupe: activite
    label: 'Couverts servis par jour'
    type: number
    defaut: 60
    min: 0
    max: 500
    unite: 'couverts'
    aide: 'Nombre moyen de repas servis par jour. Un restaurant de 40 places à Gombe tourne entre 50 et 90 couverts/jour.'

  - id: jours_ouverture_mois
    groupe: activite
    label: "Jours d'ouverture par mois"
    type: number
    defaut: 26
    min: 1
    max: 31
    unite: 'jours'
    aide: 'Ouvert 6 j/7 = 26 jours. 7 j/7 = 30. Fermé le dimanche uniquement = 26.'

  - id: ticket_moyen
    groupe: activite
    label: 'Ticket moyen par couvert'
    type: money
    devise: USD
    defaut: 12
    min: 0
    aide: 'Total moyen dépensé par client (plat + boisson + accompagnement). Gombe milieu de gamme : 10-15 USD.'

  - id: food_cost_pct
    groupe: couts_variables
    label: 'Coût matière (food cost)'
    type: percent
    defaut: 0.32
    min: 0
    max: 1
    aide: "Part du CA absorbée par l'achat des matières premières. Médiane sectorielle restauration : 30-35 %."

  - id: personnel_mois
    groupe: charges_fixes
    label: 'Masse salariale mensuelle'
    type: money
    devise: USD
    defaut: 2500
    min: 0
    aide: 'Salaires bruts totaux (chef, aide-cuisine, serveurs, gérant). Charges CNSS/IPR incluses. Ordre de grandeur pour 5-7 personnes.'

  - id: loyer_mois
    groupe: charges_fixes
    label: 'Loyer mensuel'
    type: money
    devise: USD
    defaut: 800
    min: 0
    aide: "Loyer d'un local de 80-120 m² à Gombe ou Kintambo : 600-1200 USD."

  - id: charges_diverses_mois
    groupe: charges_fixes
    label: "Charges d'exploitation diverses"
    type: money
    devise: USD
    defaut: 600
    min: 0
    aide: 'Électricité (groupe + SNEL), eau (REGIDESO), gaz, entretien, sécurité, télécoms, consommables.'

  # Note : `ibp_taux` vient désormais du ParameterPack attaché au projet (S9).
  # Le driver reste déclaré pour être visible/surchargeable dans le wizard —
  # la valeur du pack écrase la `defaut` au moment de l'évaluation.
  - id: ibp_taux
    groupe: fiscalite
    label: 'Impôt sur les bénéfices (IBP)'
    type: percent
    defaut: 0.30
    min: 0
    max: 1
    aide: 'Taux fourni par le ParameterPack du pays. Surchargeable si le régime de la société diffère du taux standard.'

  # ─── Financement (S11-lite) ─────────────────────────────────
  # Emprunt bancaire pour financer l'installation. Le service annuel de la dette
  # (mensualité × 12) alimente le ratio DSCR = EBE_annuel / service_dette_annuel.
  - id: emprunt_capital
    groupe: financement
    label: 'Capital emprunté'
    type: money
    devise: USD
    defaut: 25000
    min: 0
    aide: "Montant total du crédit d'investissement (matériel cuisine, aménagements, dépôt loyer). 0 = pas d'emprunt."

  - id: emprunt_taux_annuel
    groupe: financement
    label: "Taux d'intérêt annuel"
    type: percent
    defaut: 0.14
    min: 0
    max: 1
    aide: 'Taux nominal annuel. Valeur fournie par le ParameterPack (taux_credit_investissement_usd_pct ≈ 14 % en RDC, 8.5 % zone UEMOA).'

  - id: emprunt_duree_mois
    groupe: financement
    label: 'Durée du prêt'
    type: number
    defaut: 60
    min: 1
    max: 240
    unite: 'mois'
    aide: "Durée d'amortissement en mois. Typiquement 36 à 84 mois pour un crédit PME investissement."

  # ─── Projection pluriannuelle (S12-lite) ────────────────────
  - id: taux_croissance_ca
    groupe: activite
    label: 'Taux de croissance annuel du CA'
    type: percent
    defaut: 0.15
    min: -1
    max: 3
    aide: "Croissance annuelle attendue du chiffre d'affaires. 10-20 % typique pour un projet en démarrage. Ne pas dépasser 40 % sans justification écrite pour un dossier bancaire."

  # ─── Plan de financement initial (S12b) ─────────────────────
  # 3 besoins × 3 ressources → contrôle ressources ≥ besoins.
  # Le ratio apport / total_besoins alimente `apport_pct` dans la feuille ratios.
  - id: investissements_initiaux
    groupe: financement
    label: 'Investissements initiaux'
    type: money
    devise: USD
    defaut: 30000
    min: 0
    aide: "Matériel de cuisine + aménagements + mobilier + caisse enregistreuse + dépôt de loyer. Pour un restaurant 40 places à Gombe : 25-45 k USD selon niveau d'équipement."

  - id: bfr_initial
    groupe: financement
    label: 'Fonds de roulement de démarrage'
    type: money
    devise: USD
    defaut: 5000
    min: 0
    aide: 'Trésorerie de démarrage pour absorber les décalages (paiement fournisseurs avant encaissement clients, 3 mois de charges fixes recommandés).'

  - id: apport_capital
    groupe: financement
    label: 'Apport personnel'
    type: money
    devise: USD
    defaut: 10000
    min: 0
    aide: 'Apport en fonds propres (cash + apports en nature évalués). Doit représenter ≥ 25 % du total des besoins (30 % pour PADMPME) — voir ParameterPack (ratio_apport_min_pct).'

  # ─── Besoin en fonds de roulement (S18a, FIN-001) ───────────
  # Défauts sectoriels indicatifs pour un restaurant : encaissement quasi comptant,
  # denrées périssables donc rotation de stock très courte, crédit fournisseur court.
  # À revalider par un expert-comptable avant dépôt d'un dossier bancaire.
  - id: delai_clients_jours
    groupe: activite
    label: 'Délai de paiement clients'
    type: number
    defaut: 2
    min: 0
    max: 360
    unite: 'jours'
    aide: 'Restauration : encaissement quasi comptant (cash, mobile money, carte). 0-5 jours. Monter à 15-30 jours si une part significative du CA est facturée à des entreprises.'

  - id: delai_fournisseurs_jours
    groupe: couts_variables
    label: 'Délai de paiement fournisseurs'
    type: number
    defaut: 15
    min: 0
    max: 360
    unite: 'jours'
    aide: 'Crédit obtenu des fournisseurs de denrées. Les marchés et grossistes de Kinshasa travaillent souvent au comptant ; 15 jours est un compromis réaliste avec des fournisseurs référencés.'

  - id: rotation_stock_jours
    groupe: couts_variables
    label: 'Rotation du stock'
    type: number
    defaut: 7
    min: 0
    max: 360
    unite: 'jours'
    aide: 'Durée moyenne de détention du stock de denrées. Produits frais : 3-7 jours. Un restaurant avec une part importante de boissons et de sec peut monter à 15-20 jours.'

feuilles:
  - id: activite
    label: "Compte d'exploitation mensuel"
    lignes:
      - id: ca
        label: "Chiffre d'affaires"
        formule: 'couverts_jour * jours_ouverture_mois * ticket_moyen'
        format: money

      - id: cout_matiere
        label: 'Coût matière'
        formule: 'ca * food_cost_pct'
        format: money

      - id: marge_matiere
        label: 'Marge sur matière'
        formule: 'ca - cout_matiere'
        format: money

      - id: charges_operationnelles
        label: 'Charges opérationnelles'
        formule: 'personnel_mois + loyer_mois + charges_diverses_mois'
        format: money

      - id: excedent_brut
        label: "Excédent brut d'exploitation"
        formule: 'marge_matiere - charges_operationnelles'
        format: money

      - id: ibp
        label: 'Impôt sur les bénéfices'
        formule: 'IF(excedent_brut > 0, excedent_brut * ibp_taux, 0)'
        format: money

      - id: resultat_net
        label: 'Résultat net mensuel'
        formule: 'excedent_brut - ibp'
        format: money

  # Feuille "financement" (S11-lite) — mensualité PMT + service annuel de la dette.
  # PMT retourne un flux négatif par convention (sortie de trésorerie) → on utilise
  # -PMT pour manipuler des valeurs positives dans les formules aval.
  - id: financement
    label: 'Financement — emprunt bancaire'
    lignes:
      - id: mensualite_emprunt
        label: 'Mensualité constante'
        formule: 'IFERROR(-PMT(emprunt_taux_annuel / 12, emprunt_duree_mois, emprunt_capital), 0)'
        format: money

      - id: service_dette_annuel
        label: 'Service annuel de la dette'
        formule: 'mensualite_emprunt * 12'
        format: money

      - id: interets_annuels_estimes
        label: 'Intérêts année 1 (estimation)'
        formule: 'service_dette_annuel - (emprunt_capital / (emprunt_duree_mois / 12))'
        format: money

  # Feuille "plan_financement" (S12b) — besoins vs ressources initiaux.
  # Contrôle bancaire : ressources doivent ≥ besoins ; apport doit ≥ 25 % des besoins.
  - id: plan_financement
    label: 'Plan de financement initial'
    lignes:
      - id: pf_investissements
        label: 'Investissements'
        formule: 'investissements_initiaux'
        format: money
      - id: pf_bfr
        label: 'BFR (trésorerie de sécurité)'
        formule: 'bfr_initial'
        format: money
      - id: pf_total_besoins
        label: 'TOTAL BESOINS'
        formule: 'pf_investissements + pf_bfr'
        format: money
      - id: pf_apport
        label: 'Apport personnel'
        formule: 'apport_capital'
        format: money
      - id: pf_emprunt
        label: 'Emprunt bancaire'
        formule: 'emprunt_capital'
        format: money
      - id: pf_total_ressources
        label: 'TOTAL RESSOURCES'
        formule: 'pf_apport + pf_emprunt'
        format: money
      - id: pf_ecart
        label: 'Écart (ressources − besoins)'
        formule: 'pf_total_ressources - pf_total_besoins'
        format: money

  # Feuille "tresorerie" (S13a) — plan de trésorerie mensuel année 1.
  # Simplification MVP : solde mensuel constant (pas de saisonnalité intra-année).
  # IBP acomptes trimestriels + TVA reversée mensuellement arrivent avec l'extension
  # DSL temporelle (`mensualisable` sur drivers, feuilles typées cashflow_mensuel).
  # Malgré la simplification, résout le piège n°1 CFO-agence : une trésorerie
  # négative à un seul mois retoque le dossier.
  - id: tresorerie
    label: 'Trésorerie mensuelle année 1 — vue simplifiée (hors variation de BFR et hors intérêts)'
    lignes:
      - id: tresorerie_initiale
        label: "Trésorerie à l'ouverture (M0)"
        formule: 'apport_capital + emprunt_capital - investissements_initiaux - bfr_initial'
        format: money
      - id: solde_mensuel_operationnel
        label: 'Solde mensuel opérationnel (résultat net − mensualité)'
        formule: 'resultat_net - mensualite_emprunt'
        format: money
      - id: tresorerie_fin_m1
        label: 'Trésorerie fin mois 1'
        formule: 'tresorerie_initiale + solde_mensuel_operationnel * 1'
        format: money
      - id: tresorerie_fin_m2
        label: 'Trésorerie fin mois 2'
        formule: 'tresorerie_initiale + solde_mensuel_operationnel * 2'
        format: money
      - id: tresorerie_fin_m3
        label: 'Trésorerie fin mois 3'
        formule: 'tresorerie_initiale + solde_mensuel_operationnel * 3'
        format: money
      - id: tresorerie_fin_m6
        label: 'Trésorerie fin mois 6'
        formule: 'tresorerie_initiale + solde_mensuel_operationnel * 6'
        format: money
      - id: tresorerie_fin_m9
        label: 'Trésorerie fin mois 9'
        formule: 'tresorerie_initiale + solde_mensuel_operationnel * 9'
        format: money
      - id: tresorerie_fin_m12
        label: 'Trésorerie fin mois 12'
        formule: 'tresorerie_initiale + solde_mensuel_operationnel * 12'
        format: money
      - id: tresorerie_min_annee_1
        label: 'Trésorerie minimale sur les 12 mois'
        formule: 'MIN(tresorerie_initiale, tresorerie_fin_m12)'
        format: money

  # Feuille "projection" (S12-lite, étendue à 5 exercices en S18a) — taux de
  # croissance annuel du CA. Hypothèse simplificatrice : le résultat net croît au
  # même taux que le CA (coûts variables + fixes croissent proportionnellement).
  # C'est cette même convention qui extrapole les achats et les charges fixes des
  # états financiers (voir structure_financiere).
  - id: projection
    label: 'Projection sur 5 exercices'
    lignes:
      - id: ca_annuel_1
        label: 'CA année 1'
        formule: 'ca * 12'
        format: money
      - id: ca_annuel_2
        label: 'CA année 2'
        formule: 'ca_annuel_1 * (1 + taux_croissance_ca)'
        format: money
      - id: ca_annuel_3
        label: 'CA année 3'
        formule: 'ca_annuel_2 * (1 + taux_croissance_ca)'
        format: money
      - id: ca_annuel_4
        label: 'CA année 4'
        formule: 'ca_annuel_3 * (1 + taux_croissance_ca)'
        format: money
      - id: ca_annuel_5
        label: 'CA année 5'
        formule: 'ca_annuel_4 * (1 + taux_croissance_ca)'
        format: money
      - id: resultat_annuel_1
        label: 'Résultat net année 1'
        formule: 'resultat_net * 12'
        format: money
      - id: resultat_annuel_2
        label: 'Résultat net année 2'
        formule: 'resultat_annuel_1 * (1 + taux_croissance_ca)'
        format: money
      - id: resultat_annuel_3
        label: 'Résultat net année 3'
        formule: 'resultat_annuel_2 * (1 + taux_croissance_ca)'
        format: money
      - id: resultat_annuel_4
        label: 'Résultat net année 4'
        formule: 'resultat_annuel_3 * (1 + taux_croissance_ca)'
        format: money
      - id: resultat_annuel_5
        label: 'Résultat net année 5'
        formule: 'resultat_annuel_4 * (1 + taux_croissance_ca)'
        format: money
      # Conservée telle quelle pour non-régression (ADR-0011 § Contrat 1 : aucune
      # ligne existante renommée ni retypée).
      - id: resultat_cumule_3ans
        label: 'Résultat cumulé sur 3 ans'
        formule: 'resultat_annuel_1 + resultat_annuel_2 + resultat_annuel_3'
        format: money
      - id: resultat_cumule_5ans
        label: 'Résultat cumulé sur 5 exercices'
        formule: 'resultat_cumule_3ans + resultat_annuel_4 + resultat_annuel_5'
        format: money

  # Feuille "ratios" (S10) : chaque ligne peut porter un `seuil_pack` qui pointe vers un
  # paramètre du ParameterPack, avec direction min/max. L'évaluateur y attache un feu
  # tricolore vert/orange/rouge que l'UI et le PDF affichent.
  - id: ratios
    label: 'Ratios financiers'
    lignes:
      - id: marge_ebe_pct
        label: 'Marge EBE (EBE / CA)'
        formule: 'IFERROR(excedent_brut / ca, 0)'
        format: percent
        seuil_pack: ratio_marge_ebe_min
        seuil_direction: min

      - id: marge_nette_pct
        label: 'Marge nette (Résultat / CA)'
        formule: 'IFERROR(resultat_net / ca, 0)'
        format: percent
        seuil_pack: ratio_marge_nette_min
        seuil_direction: min

      # DSCR (S11-lite) — Debt Service Coverage Ratio, indicateur bancaire n°1.
      # EBE annuel / service annuel de la dette. Doit être ≥ 1.25 pour être bancable.
      - id: dscr
        label: 'DSCR (couverture du service de la dette)'
        formule: 'IFERROR((excedent_brut * 12) / service_dette_annuel, 0)'
        format: number
        seuil_pack: ratio_dscr_min
        seuil_direction: min

      # Trésorerie minimale (S13a) — feu ROUGE dès qu'elle est négative à un mois.
      # Piège n°1 CFO-agence : dossier retoqué systématiquement si la ligne "trésorerie
      # fin de mois" passe en-dessous de zéro à un mois quelconque.
      - id: tresorerie_min_ok
        label: 'Trésorerie mini sur 12 mois (vue simplifiée — voir onglet Bilan)'
        formule: 'tresorerie_min_annee_1'
        format: money
        seuil_pack: tresorerie_min_seuil
        seuil_direction: min

      # Ratio apport (S12b) — apport / total des besoins. Doit être ≥ 25 % (30 % PADMPME).
      # Seuil bancaire critique — un dossier avec apport < 20 % est retoqué sans lecture.
      - id: apport_pct
        label: 'Ratio apport personnel sur besoins'
        formule: 'IFERROR(apport_capital / pf_total_besoins, 0)'
        format: percent
        seuil_pack: ratio_apport_min_pct
        seuil_direction: min

      # Payback (S12-lite) — délai de récupération de l'investissement en années.
      # Emprunt / résultat net annuel année 1. Seuil pack `ratio_payback_max` (5 ans).
      - id: payback_annees
        label: "Délai de récupération de l'investissement"
        formule: 'IFERROR(emprunt_capital / resultat_annuel_1, 0)'
        format: number
        seuil_pack: ratio_payback_max
        seuil_direction: max

      - id: taux_effort_matiere
        label: "Taux d'effort matière"
        formule: 'IFERROR(cout_matiere / ca, 0)'
        format: percent
