# Template sectoriel : quincaillerie et négoce (S6-lite).
#
# Portée : moyennes mensuelles. Le modèle négoce = achat/revente pure, sans transformation.
# La rotation de stock et le BFR seront modélisés en S7 (extension DSL).
# Fiscalité : IBP SYSCOHADA/RDC 30 %.

slug: quincaillerie-negoce
version: 1.0.0
secteur: negoce
pays: [CD]
devise_base: USD
horizon_mois: 12
# S18a (FIN-001) : horizon 5 exercices (docs/07 « horizon standard : 5 exercices »).
horizon_projection_annees: 5

# ─── Immobilisations amortissables (S14c, activées S18a) ──────
# Total des `montant_ht` calé sur le défaut de `investissements_initiaux`
# (15 000 USD). Le stock initial n'est PAS une immobilisation : il est financé
# par `bfr_initial` (voir l'aide des deux drivers).
immobilisations:
  - label: 'Rayonnage, comptoir et agencement du magasin'
    categorie: amenagements
    montant_ht: 7000
    date_acquisition: '2026-01-01'
  - label: 'Outillage et matériel de manutention'
    categorie: materiel_outillage
    montant_ht: 4500
    date_acquisition: '2026-01-01'
  - label: 'Mobilier de bureau'
    categorie: mobilier_bureau
    montant_ht: 2500
    date_acquisition: '2026-01-01'
  - label: 'Caisse enregistreuse et informatique'
    categorie: materiel_informatique
    montant_ht: 1000
    date_acquisition: '2026-01-01'

# ─── États financiers prévisionnels (S18a, FIN-001) ───────────
structure_financiere:
  achats_variables_mensuels: cout_achat_marchandises
  charges_fixes_mensuelles: charges_operationnelles

groupes_hypotheses:
  - id: activite
    label: 'Activité'
  - id: couts_variables
    label: "Coûts d'achat"
  - id: charges_fixes
    label: 'Charges fixes'
  - id: fiscalite
    label: 'Fiscalité'
  - id: financement
    label: 'Financement'

# Découpage du wizard de saisie (S18c) — présentation uniquement, aucun impact calcul.
# Ordre inspiré de docs/06-WIZARD.md (CA → coûts → personnel → investissement →
# financement → fiscalité), adapté aux groupes réellement déclarés ci-dessus :
# le personnel vit dans `charges_fixes`, l'investissement dans `financement`.
wizard:
  etapes:
    - id: chiffre_affaires
      label: "Chiffre d'affaires"
      description: 'Ce que le comptoir encaisse un jour type, et combien de jours par mois.'
      groupes: [activite]
      ordre: 1
    - id: couts_achat
      label: "Coûts d'achat"
      description: 'La marge commerciale dégagée sur la marchandise revendue.'
      groupes: [couts_variables]
      ordre: 2
    - id: charges_fixes
      label: 'Charges fixes et personnel'
      description: 'Les dépenses dues chaque mois, quel que soit le niveau d’activité.'
      groupes: [charges_fixes]
      ordre: 3
    - id: investissement_financement
      label: 'Investissement et financement'
      description: 'Ce que vous installez au départ, et comment vous le financez.'
      groupes: [financement]
      ordre: 4
    - id: fiscalite
      label: 'Fiscalité'
      description: 'Paramètres fiscaux pré-remplis par le Country Pack — à confirmer.'
      groupes: [fiscalite]
      ordre: 5

drivers:
  - id: ca_moyen_jour
    groupe: activite
    label: "Chiffre d'affaires moyen par jour"
    type: money
    devise: USD
    defaut: 500
    min: 0
    aide: 'Ventes moyennes journalières toutes catégories confondues. Une quincaillerie de quartier en zone urbaine : 300-800 USD/jour selon zone et achalandage.'

  - id: jours_ouverture_mois
    groupe: activite
    label: "Jours d'ouverture par mois"
    type: number
    defaut: 26
    min: 1
    max: 31
    unite: 'jours'
    aide: 'Ouvert 6 j/7 = 26 jours. Beaucoup de commerces de la zone ferment le dimanche.'

  - id: marge_commerciale_pct
    groupe: couts_variables
    label: 'Marge commerciale sur ventes'
    type: percent
    defaut: 0.25
    min: 0
    max: 1
    aide: 'Marge brute exprimée en % du prix de vente : (PV - PA) / PV. Quincaillerie/négoce : typiquement 20-30 %. Fer, ciment : plus bas. Petits accessoires : plus haut.'

  - id: personnel_mois
    groupe: charges_fixes
    label: 'Masse salariale mensuelle'
    type: money
    devise: USD
    defaut: 1200
    min: 0
    aide: 'Salaires bruts totaux (2 vendeurs + gérant). Charges CNSS/IPR incluses. Ordre de grandeur pour 3 personnes.'

  - id: loyer_mois
    groupe: charges_fixes
    label: 'Loyer mensuel'
    type: money
    devise: USD
    defaut: 500
    min: 0
    aide: "Local commercial de 40-80 m² en zone d'activité, hors quartier d'affaires central : 300-700 USD."

  - id: transport_stock_mois
    groupe: charges_fixes
    label: "Transport et logistique d'approvisionnement"
    type: money
    devise: USD
    defaut: 300
    min: 0
    aide: 'Frais de transport et de manutention des stocks (retraits port, camion, débardage). Varie selon la fréquence de réapprovisionnement.'

  - id: charges_diverses_mois
    groupe: charges_fixes
    label: "Charges d'exploitation diverses"
    type: money
    devise: USD
    defaut: 300
    min: 0
    aide: 'Électricité, sécurité, télécoms, consommables, patente et taxes locales mensualisées.'

  # Voir note S9 : `ibp_taux` vient du ParameterPack du projet, `defaut` = fallback.
  - id: ibp_taux
    groupe: fiscalite
    label: 'Impôt sur les bénéfices (IBP)'
    type: percent
    defaut: 0.30
    min: 0
    max: 1
    aide: 'Taux fourni par le ParameterPack du pays. Surchargeable si le régime le justifie.'

  # ─── Financement (S11-lite) ─────────────────────────────────
  - id: emprunt_capital
    groupe: financement
    label: 'Capital emprunté'
    type: money
    devise: USD
    defaut: 12000
    min: 0
    aide: "Crédit d'investissement (stock initial + rayonnage + local). 0 = pas d'emprunt."

  - id: emprunt_taux_annuel
    groupe: financement
    label: "Taux d'intérêt annuel"
    type: percent
    defaut: 0.14
    min: 0
    max: 1
    aide: 'Taux nominal annuel — voir ParameterPack (taux_credit_investissement_usd_pct).'

  - id: emprunt_duree_mois
    groupe: financement
    label: 'Durée du prêt'
    type: number
    defaut: 48
    min: 1
    max: 240
    unite: 'mois'
    aide: "Durée d'amortissement. 36-60 mois typiques pour crédit stock commerce."

  # ─── Projection pluriannuelle (S12-lite) ────────────────────
  - id: taux_croissance_ca
    groupe: activite
    label: 'Taux de croissance annuel du CA'
    type: percent
    defaut: 0.10
    min: -1
    max: 3
    aide: "Croissance annuelle du chiffre d'affaires. 5-15 % typique pour un commerce établi, plus en démarrage."

  # ─── Plan de financement initial (S12b) ─────────────────────
  - id: investissements_initiaux
    groupe: financement
    label: 'Investissements initiaux'
    type: money
    devise: USD
    defaut: 15000
    min: 0
    aide: "Rayonnage + comptoir + outillage + caisse — les biens durables amortissables. Pour une quincaillerie de 40-80 m² : 10-20 k USD. Le stock initial ne se saisit PAS ici : c'est du besoin en fonds de roulement, à porter sur « Fonds de roulement de démarrage »."

  - id: bfr_initial
    groupe: financement
    label: 'Fonds de roulement de démarrage'
    type: money
    devise: USD
    defaut: 3000
    min: 0
    aide: 'Trésorerie de démarrage. Le négoce a un cycle stock long → prévoir plus si DSO clients élevé.'

  - id: apport_capital
    groupe: financement
    label: 'Apport personnel'
    type: money
    devise: USD
    defaut: 6000
    min: 0
    aide: 'Apport en fonds propres. ≥ 25 % du total des besoins pour être bancable.'

  # ─── Besoin en fonds de roulement (S18a, FIN-001) ───────────
  # Défauts sectoriels indicatifs pour le négoce : une part du CA vendue à crédit
  # aux artisans et entreprises, stock lourd et lent (fer, ciment, quincaillerie),
  # crédit fournisseur négocié. À revalider par un expert-comptable.
  - id: delai_clients_jours
    groupe: activite
    label: 'Délai de paiement clients'
    type: number
    defaut: 15
    min: 0
    max: 360
    unite: 'jours'
    aide: 'Moyenne pondérée entre le comptant (particuliers) et le crédit consenti aux artisans, entreprises et chantiers. 0 si vous ne vendez qu’au comptant ; 30-45 jours si les chantiers dominent.'

  - id: delai_fournisseurs_jours
    groupe: couts_variables
    label: 'Délai de paiement fournisseurs'
    type: number
    defaut: 30
    min: 0
    max: 360
    unite: 'jours'
    aide: 'Crédit obtenu des grossistes et importateurs. 30 jours est courant avec un fournisseur référencé ; 0 pour un achat sur facture pro forma au port.'

  - id: rotation_stock_jours
    groupe: couts_variables
    label: 'Rotation du stock'
    type: number
    defaut: 60
    min: 0
    max: 360
    unite: 'jours'
    aide: 'Durée moyenne de détention du stock. Le négoce de quincaillerie tourne lentement (largeur de gamme, réapprovisionnement par lots) : 45-90 jours. C’est le principal poste de BFR du secteur.'

feuilles:
  - id: activite
    label: "Compte d'exploitation mensuel"
    lignes:
      - id: ca
        label: "Chiffre d'affaires"
        formule: 'ca_moyen_jour * jours_ouverture_mois'
        format: money

      - id: cout_achat_marchandises
        label: "Coût d'achat des marchandises vendues"
        formule: 'ca * (1 - marge_commerciale_pct)'
        format: money

      - id: marge_brute
        label: 'Marge brute'
        formule: 'ca - cout_achat_marchandises'
        format: money

      - id: charges_operationnelles
        label: 'Charges opérationnelles'
        formule: 'personnel_mois + loyer_mois + transport_stock_mois + charges_diverses_mois'
        format: money

      - id: excedent_brut
        label: "Excédent brut d'exploitation"
        formule: 'marge_brute - charges_operationnelles'
        format: money

      - id: ibp
        label: 'Impôt sur les bénéfices'
        formule: 'IF(excedent_brut > 0, excedent_brut * ibp_taux, 0)'
        format: money

      - id: resultat_net
        label: 'Résultat net mensuel'
        formule: 'excedent_brut - ibp'
        format: money

  - id: financement
    label: 'Financement — emprunt bancaire'
    lignes:
      - id: mensualite_emprunt
        label: 'Mensualité constante'
        formule: 'IFERROR(-PMT(emprunt_taux_annuel / 12, emprunt_duree_mois, emprunt_capital), 0)'
        format: money

      - id: service_dette_annuel
        label: 'Service annuel de la dette'
        formule: 'mensualite_emprunt * 12'
        format: money

      - id: interets_annuels_estimes
        label: 'Intérêts année 1 (estimation)'
        formule: 'service_dette_annuel - (emprunt_capital / (emprunt_duree_mois / 12))'
        format: money

  # Feuille "plan_financement" (S12b) — besoins vs ressources.
  - id: plan_financement
    label: 'Plan de financement initial'
    lignes:
      - id: pf_investissements
        label: 'Investissements'
        formule: 'investissements_initiaux'
        format: money
      - id: pf_bfr
        label: 'BFR (trésorerie de sécurité)'
        formule: 'bfr_initial'
        format: money
      - id: pf_total_besoins
        label: 'TOTAL BESOINS'
        formule: 'pf_investissements + pf_bfr'
        format: money
      - id: pf_apport
        label: 'Apport personnel'
        formule: 'apport_capital'
        format: money
      - id: pf_emprunt
        label: 'Emprunt bancaire'
        formule: 'emprunt_capital'
        format: money
      - id: pf_total_ressources
        label: 'TOTAL RESSOURCES'
        formule: 'pf_apport + pf_emprunt'
        format: money
      - id: pf_ecart
        label: 'Écart (ressources − besoins)'
        formule: 'pf_total_ressources - pf_total_besoins'
        format: money

  # Feuille "tresorerie" (S13a) — plan de trésorerie mensuel année 1 (simplifié).
  - id: tresorerie
    label: 'Trésorerie mensuelle année 1 — vue simplifiée (hors variation de BFR et hors intérêts)'
    lignes:
      - id: tresorerie_initiale
        label: "Trésorerie à l'ouverture (M0)"
        formule: 'apport_capital + emprunt_capital - investissements_initiaux - bfr_initial'
        format: money
      - id: solde_mensuel_operationnel
        label: 'Solde mensuel opérationnel'
        formule: 'resultat_net - mensualite_emprunt'
        format: money
      - id: tresorerie_fin_m1
        label: 'Trésorerie fin mois 1'
        formule: 'tresorerie_initiale + solde_mensuel_operationnel * 1'
        format: money
      - id: tresorerie_fin_m3
        label: 'Trésorerie fin mois 3'
        formule: 'tresorerie_initiale + solde_mensuel_operationnel * 3'
        format: money
      - id: tresorerie_fin_m6
        label: 'Trésorerie fin mois 6'
        formule: 'tresorerie_initiale + solde_mensuel_operationnel * 6'
        format: money
      - id: tresorerie_fin_m9
        label: 'Trésorerie fin mois 9'
        formule: 'tresorerie_initiale + solde_mensuel_operationnel * 9'
        format: money
      - id: tresorerie_fin_m12
        label: 'Trésorerie fin mois 12'
        formule: 'tresorerie_initiale + solde_mensuel_operationnel * 12'
        format: money
      - id: tresorerie_min_annee_1
        label: 'Trésorerie minimale sur les 12 mois'
        formule: 'MIN(tresorerie_initiale, tresorerie_fin_m12)'
        format: money

  # Feuille "projection" (S12-lite, étendue à 5 exercices en S18a) — taux de
  # croissance annuel du CA. Hypothèse simplificatrice : le résultat net croît au
  # même taux que le CA (coûts variables + fixes croissent proportionnellement).
  # C'est cette même convention qui extrapole les achats et les charges fixes des
  # états financiers (voir structure_financiere).
  - id: projection
    label: 'Projection sur 5 exercices'
    lignes:
      - id: ca_annuel_1
        label: 'CA année 1'
        formule: 'ca * 12'
        format: money
      - id: ca_annuel_2
        label: 'CA année 2'
        formule: 'ca_annuel_1 * (1 + taux_croissance_ca)'
        format: money
      - id: ca_annuel_3
        label: 'CA année 3'
        formule: 'ca_annuel_2 * (1 + taux_croissance_ca)'
        format: money
      - id: ca_annuel_4
        label: 'CA année 4'
        formule: 'ca_annuel_3 * (1 + taux_croissance_ca)'
        format: money
      - id: ca_annuel_5
        label: 'CA année 5'
        formule: 'ca_annuel_4 * (1 + taux_croissance_ca)'
        format: money
      - id: resultat_annuel_1
        label: 'Résultat net année 1'
        formule: 'resultat_net * 12'
        format: money
      - id: resultat_annuel_2
        label: 'Résultat net année 2'
        formule: 'resultat_annuel_1 * (1 + taux_croissance_ca)'
        format: money
      - id: resultat_annuel_3
        label: 'Résultat net année 3'
        formule: 'resultat_annuel_2 * (1 + taux_croissance_ca)'
        format: money
      - id: resultat_annuel_4
        label: 'Résultat net année 4'
        formule: 'resultat_annuel_3 * (1 + taux_croissance_ca)'
        format: money
      - id: resultat_annuel_5
        label: 'Résultat net année 5'
        formule: 'resultat_annuel_4 * (1 + taux_croissance_ca)'
        format: money
      # Conservée telle quelle pour non-régression (ADR-0011 § Contrat 1 : aucune
      # ligne existante renommée ni retypée).
      - id: resultat_cumule_3ans
        label: 'Résultat cumulé sur 3 ans'
        formule: 'resultat_annuel_1 + resultat_annuel_2 + resultat_annuel_3'
        format: money
      - id: resultat_cumule_5ans
        label: 'Résultat cumulé sur 5 exercices'
        formule: 'resultat_cumule_3ans + resultat_annuel_4 + resultat_annuel_5'
        format: money

  - id: ratios
    label: 'Ratios financiers'
    lignes:
      - id: marge_ebe_pct
        label: 'Marge EBE (EBE / CA)'
        formule: 'IFERROR(excedent_brut / ca, 0)'
        format: percent
        seuil_pack: ratio_marge_ebe_min
        seuil_direction: min

      - id: marge_nette_pct
        label: 'Marge nette (Résultat / CA)'
        formule: 'IFERROR(resultat_net / ca, 0)'
        format: percent
        seuil_pack: ratio_marge_nette_min
        seuil_direction: min

      - id: dscr
        label: 'DSCR (couverture du service de la dette)'
        formule: 'IFERROR((excedent_brut * 12) / service_dette_annuel, 0)'
        format: number
        seuil_pack: ratio_dscr_min
        seuil_direction: min

      - id: tresorerie_min_ok
        label: 'Trésorerie mini sur 12 mois (vue simplifiée — voir onglet Bilan)'
        formule: 'tresorerie_min_annee_1'
        format: money
        seuil_pack: tresorerie_min_seuil
        seuil_direction: min

      - id: apport_pct
        label: 'Ratio apport personnel sur besoins'
        formule: 'IFERROR(apport_capital / pf_total_besoins, 0)'
        format: percent
        seuil_pack: ratio_apport_min_pct
        seuil_direction: min

      - id: payback_annees
        label: "Délai de récupération de l'investissement"
        formule: 'IFERROR(emprunt_capital / resultat_annuel_1, 0)'
        format: number
        seuil_pack: ratio_payback_max
        seuil_direction: max

      - id: marge_commerciale_effective
        label: 'Marge commerciale effective'
        formule: 'IFERROR(marge_brute / ca, 0)'
        format: percent
