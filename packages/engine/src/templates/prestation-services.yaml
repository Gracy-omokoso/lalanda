# Template sectoriel : prestation de services (conseil, agence, freelance) — S6-lite.
#
# Portée : moyennes mensuelles. Modèle de facturation à la journée (T&M).
# La facturation au forfait, la mensualisation et le suivi par mission arrivent en S7.
# Fiscalité : IBP SYSCOHADA/RDC 30 %.

slug: prestation-services
version: 1.0.0
secteur: services
pays: [CD]
devise_base: USD
horizon_mois: 12
# S18a (FIN-001) : horizon 5 exercices (docs/07 « horizon standard : 5 exercices »).
horizon_projection_annees: 5

# ─── Immobilisations amortissables (S14c, activées S18a) ──────
# Total des `montant_ht` calé sur le défaut de `investissements_initiaux` (6 000 USD).
immobilisations:
  - label: 'Matériel informatique'
    categorie: materiel_informatique
    montant_ht: 3500
    date_acquisition: '2026-01-01'
  - label: 'Mobilier et aménagement du poste de travail'
    categorie: mobilier_bureau
    montant_ht: 1500
    date_acquisition: '2026-01-01'
  - label: 'Logiciels et identité visuelle'
    categorie: logiciels
    montant_ht: 1000
    date_acquisition: '2026-01-01'

# ─── États financiers prévisionnels (S18a, FIN-001) ───────────
# Pas de clé `achats_variables_mensuels` : le modèle de prestation ne comporte
# aucun achat variable indexé sur le volume — l'équipe et la sous-traitance
# récurrente sont déclarées en charges fixes. Conséquence assumée et documentée :
# charges variables = 0, taux de marge sur coûts variables = 100 %, donc le seuil
# de rentabilité vaut exactement les charges fixes, et le stock est nul.
structure_financiere:
  charges_fixes_mensuelles: charges_operationnelles

groupes_hypotheses:
  - id: activite
    label: 'Activité'
  - id: charges_fixes
    label: 'Charges fixes'
  - id: fiscalite
    label: 'Fiscalité'
  - id: financement
    label: 'Financement'

# Découpage du wizard de saisie (S18c) — présentation uniquement, aucun impact calcul.
# Ordre inspiré de docs/06-WIZARD.md (CA → coûts → personnel → investissement →
# financement → fiscalité), adapté aux groupes réellement déclarés ci-dessus :
# une prestation de services n'a pas de coûts variables ; le personnel opérationnel
# et l'investissement vivent respectivement dans `charges_fixes` et `financement`.
etapes:
  - id: chiffre_affaires
    label: "Chiffre d'affaires"
    description: 'Votre tarif journalier et le nombre de jours réellement facturables.'
    groupes: [activite]
    ordre: 1
  - id: charges_fixes
    label: 'Charges fixes et personnel'
    description: 'Les dépenses dues chaque mois, quel que soit le niveau d’activité.'
    groupes: [charges_fixes]
    ordre: 2
  - id: investissement_financement
    label: 'Investissement et financement'
    description: 'Ce que vous installez au départ, et comment vous le financez.'
    groupes: [financement]
    ordre: 3
  - id: fiscalite
    label: 'Fiscalité'
    description: 'Paramètres fiscaux pré-remplis par le Country Pack — à confirmer.'
    groupes: [fiscalite]
    ordre: 4

drivers:
  - id: tarif_journalier_moyen
    groupe: activite
    label: 'Tarif journalier moyen'
    type: money
    devise: USD
    defaut: 200
    min: 0
    aide: "Prix moyen d'une journée facturée à un client. Conseil / agence à Kinshasa : 150-350 USD selon expertise et positionnement."

  - id: jours_facturables_mois
    groupe: activite
    label: 'Jours facturables par mois'
    type: number
    defaut: 15
    min: 0
    max: 22
    unite: 'jours'
    aide: "Nombre de jours effectivement facturés à un client. Sur 22 jours ouvrés, un taux de facturation sain est 60-80 % (soit 13-17 jours). Le reste est absorbé par la prospection, l'administratif et la formation."

  - id: personnel_operationnel_mois
    groupe: charges_fixes
    label: 'Équipe et sous-traitance mensuelles'
    type: money
    devise: USD
    defaut: 1000
    min: 0
    aide: "Coût de l'équipe salariée et/ou des sous-traitants récurrents. À zéro pour un freelance seul."

  - id: bureau_mois
    groupe: charges_fixes
    label: 'Bureau ou coworking'
    type: money
    devise: USD
    defaut: 300
    min: 0
    aide: "Loyer d'un poste en coworking (Kin's Business Hub, Ingenious City, Silikin Village) ou petit bureau. Coworking : 150-400 USD/poste/mois."

  - id: outils_logiciels_mois
    groupe: charges_fixes
    label: 'Logiciels et abonnements'
    type: money
    devise: USD
    defaut: 150
    min: 0
    aide: 'Suite bureautique, outils métier, IA, comptabilité, stockage cloud, VPN. Ordre de grandeur pour une petite structure.'

  - id: marketing_mois
    groupe: charges_fixes
    label: 'Marketing et acquisition'
    type: money
    devise: USD
    defaut: 200
    min: 0
    aide: 'Publicité, référencement, événements, contenus. Généralement 5-10 % du CA visé.'

  - id: charges_diverses_mois
    groupe: charges_fixes
    label: "Charges d'exploitation diverses"
    type: money
    devise: USD
    defaut: 150
    min: 0
    aide: 'Télécoms, déplacements, fournitures, honoraires comptables, assurance responsabilité civile professionnelle.'

  # Voir note S9 : `ibp_taux` vient du ParameterPack du projet, `defaut` = fallback.
  - id: ibp_taux
    groupe: fiscalite
    label: 'Impôt sur les bénéfices (IBP)'
    type: percent
    defaut: 0.30
    min: 0
    max: 1
    aide: 'Taux fourni par le ParameterPack du pays. Surchargeable si le régime le justifie.'

  # ─── Financement (S11-lite) ─────────────────────────────────
  # Services = besoin d'investissement typiquement plus faible (bureau + outils).
  - id: emprunt_capital
    groupe: financement
    label: 'Capital emprunté'
    type: money
    devise: USD
    defaut: 5000
    min: 0
    aide: "Crédit d'investissement (matériel informatique, coworking, marketing initial). 0 = pas d'emprunt."

  - id: emprunt_taux_annuel
    groupe: financement
    label: "Taux d'intérêt annuel"
    type: percent
    defaut: 0.14
    min: 0
    max: 1
    aide: 'Taux nominal annuel — voir ParameterPack.'

  - id: emprunt_duree_mois
    groupe: financement
    label: 'Durée du prêt'
    type: number
    defaut: 36
    min: 1
    max: 240
    unite: 'mois'
    aide: "Durée d'amortissement. 24-48 mois typiques pour un crédit services."

  # ─── Projection pluriannuelle (S12-lite) ────────────────────
  - id: taux_croissance_ca
    groupe: activite
    label: 'Taux de croissance annuel du CA'
    type: percent
    defaut: 0.2
    min: -1
    max: 3
    aide: "Croissance annuelle du chiffre d'affaires. 20-40 % réaliste pour une agence en démarrage (montée en charge du portefeuille clients)."

  # ─── Plan de financement initial (S12b) ─────────────────────
  - id: investissements_initiaux
    groupe: financement
    label: 'Investissements initiaux'
    type: money
    devise: USD
    defaut: 6000
    min: 0
    aide: 'Matériel informatique + logiciels + coworking dépôt + identité visuelle. Pour une agence conseil : 5-10 k USD.'

  - id: bfr_initial
    groupe: financement
    label: 'Fonds de roulement de démarrage'
    type: money
    devise: USD
    defaut: 4000
    min: 0
    aide: 'Trésorerie de démarrage. Services = DSO grand compte 60-90 j → prévoir 3 mois de charges fixes.'

  - id: apport_capital
    groupe: financement
    label: 'Apport personnel'
    type: money
    devise: USD
    defaut: 3500
    min: 0
    aide: 'Apport en fonds propres. ≥ 25 % du total des besoins pour être bancable.'

  # ─── Besoin en fonds de roulement (S18a, FIN-001) ───────────
  # Défauts sectoriels pour le conseil / l'agence : DSO long (grands comptes,
  # administrations), aucun stock, fournisseurs marginaux. Le délai clients est
  # LE poste de BFR du secteur — cohérent avec l'aide du fonds de roulement de
  # démarrage ci-dessus (« DSO grand compte 60-90 j »).
  - id: delai_clients_jours
    groupe: activite
    label: 'Délai de paiement clients'
    type: number
    defaut: 60
    min: 0
    max: 360
    unite: 'jours'
    aide: 'Délai réel d’encaissement des factures. PME privées : 30-45 jours. Grands comptes, banques, ONG et administrations : 60-90 jours, parfois davantage. C’est le premier poste de trésorerie d’une agence.'

  - id: delai_fournisseurs_jours
    groupe: charges_fixes
    label: 'Délai de paiement fournisseurs'
    type: number
    defaut: 30
    min: 0
    max: 360
    unite: 'jours'
    aide: 'Crédit obtenu des fournisseurs. Sans achats variables déclarés, ce délai n’a pas d’effet sur le BFR de ce modèle — il reste saisissable pour un usage futur.'

  - id: rotation_stock_jours
    groupe: charges_fixes
    label: 'Rotation du stock'
    type: number
    defaut: 0
    min: 0
    max: 360
    unite: 'jours'
    aide: 'Nul pour une activité de service : il n’y a pas de stock à financer.'

feuilles:
  - id: activite
    label: "Compte d'exploitation mensuel"
    lignes:
      - id: ca
        label: "Chiffre d'affaires"
        formule: 'tarif_journalier_moyen * jours_facturables_mois'
        format: money

      - id: charges_operationnelles
        label: 'Charges opérationnelles'
        formule: 'personnel_operationnel_mois + bureau_mois + outils_logiciels_mois + marketing_mois + charges_diverses_mois'
        format: money

      - id: excedent_brut
        label: "Excédent brut d'exploitation"
        formule: 'ca - charges_operationnelles'
        format: money

      - id: ibp
        label: 'Impôt sur les bénéfices'
        formule: 'IF(excedent_brut > 0, excedent_brut * ibp_taux, 0)'
        format: money

      - id: resultat_net
        label: 'Résultat net mensuel'
        formule: 'excedent_brut - ibp'
        format: money

  - id: financement
    label: 'Financement — emprunt bancaire'
    lignes:
      - id: mensualite_emprunt
        label: 'Mensualité constante'
        formule: 'IFERROR(-PMT(emprunt_taux_annuel / 12, emprunt_duree_mois, emprunt_capital), 0)'
        format: money

      - id: service_dette_annuel
        label: 'Service annuel de la dette'
        formule: 'mensualite_emprunt * 12'
        format: money

      - id: interets_annuels_estimes
        label: 'Intérêts année 1 (estimation)'
        formule: 'service_dette_annuel - (emprunt_capital / (emprunt_duree_mois / 12))'
        format: money

  # Feuille "plan_financement" (S12b) — besoins vs ressources.
  - id: plan_financement
    label: 'Plan de financement initial'
    lignes:
      - id: pf_investissements
        label: 'Investissements'
        formule: 'investissements_initiaux'
        format: money
      - id: pf_bfr
        label: 'BFR (trésorerie de sécurité)'
        formule: 'bfr_initial'
        format: money
      - id: pf_total_besoins
        label: 'TOTAL BESOINS'
        formule: 'pf_investissements + pf_bfr'
        format: money
      - id: pf_apport
        label: 'Apport personnel'
        formule: 'apport_capital'
        format: money
      - id: pf_emprunt
        label: 'Emprunt bancaire'
        formule: 'emprunt_capital'
        format: money
      - id: pf_total_ressources
        label: 'TOTAL RESSOURCES'
        formule: 'pf_apport + pf_emprunt'
        format: money
      - id: pf_ecart
        label: 'Écart (ressources − besoins)'
        formule: 'pf_total_ressources - pf_total_besoins'
        format: money

  # Feuille "tresorerie" (S13a) — plan de trésorerie mensuel année 1 (simplifié).
  - id: tresorerie
    label: 'Trésorerie mensuelle année 1 — vue simplifiée (hors variation de BFR et hors intérêts)'
    lignes:
      - id: tresorerie_initiale
        label: "Trésorerie à l'ouverture (M0)"
        formule: 'apport_capital + emprunt_capital - investissements_initiaux - bfr_initial'
        format: money
      - id: solde_mensuel_operationnel
        label: 'Solde mensuel opérationnel'
        formule: 'resultat_net - mensualite_emprunt'
        format: money
      - id: tresorerie_fin_m1
        label: 'Trésorerie fin mois 1'
        formule: 'tresorerie_initiale + solde_mensuel_operationnel * 1'
        format: money
      - id: tresorerie_fin_m3
        label: 'Trésorerie fin mois 3'
        formule: 'tresorerie_initiale + solde_mensuel_operationnel * 3'
        format: money
      - id: tresorerie_fin_m6
        label: 'Trésorerie fin mois 6'
        formule: 'tresorerie_initiale + solde_mensuel_operationnel * 6'
        format: money
      - id: tresorerie_fin_m9
        label: 'Trésorerie fin mois 9'
        formule: 'tresorerie_initiale + solde_mensuel_operationnel * 9'
        format: money
      - id: tresorerie_fin_m12
        label: 'Trésorerie fin mois 12'
        formule: 'tresorerie_initiale + solde_mensuel_operationnel * 12'
        format: money
      - id: tresorerie_min_annee_1
        label: 'Trésorerie minimale sur les 12 mois'
        formule: 'MIN(tresorerie_initiale, tresorerie_fin_m12)'
        format: money

  # Feuille "projection" (S12-lite, étendue à 5 exercices en S18a) — taux de
  # croissance annuel du CA. Hypothèse simplificatrice : le résultat net croît au
  # même taux que le CA (coûts variables + fixes croissent proportionnellement).
  # C'est cette même convention qui extrapole les achats et les charges fixes des
  # états financiers (voir structure_financiere).
  - id: projection
    label: 'Projection sur 5 exercices'
    lignes:
      - id: ca_annuel_1
        label: 'CA année 1'
        formule: 'ca * 12'
        format: money
      - id: ca_annuel_2
        label: 'CA année 2'
        formule: 'ca_annuel_1 * (1 + taux_croissance_ca)'
        format: money
      - id: ca_annuel_3
        label: 'CA année 3'
        formule: 'ca_annuel_2 * (1 + taux_croissance_ca)'
        format: money
      - id: ca_annuel_4
        label: 'CA année 4'
        formule: 'ca_annuel_3 * (1 + taux_croissance_ca)'
        format: money
      - id: ca_annuel_5
        label: 'CA année 5'
        formule: 'ca_annuel_4 * (1 + taux_croissance_ca)'
        format: money
      - id: resultat_annuel_1
        label: 'Résultat net année 1'
        formule: 'resultat_net * 12'
        format: money
      - id: resultat_annuel_2
        label: 'Résultat net année 2'
        formule: 'resultat_annuel_1 * (1 + taux_croissance_ca)'
        format: money
      - id: resultat_annuel_3
        label: 'Résultat net année 3'
        formule: 'resultat_annuel_2 * (1 + taux_croissance_ca)'
        format: money
      - id: resultat_annuel_4
        label: 'Résultat net année 4'
        formule: 'resultat_annuel_3 * (1 + taux_croissance_ca)'
        format: money
      - id: resultat_annuel_5
        label: 'Résultat net année 5'
        formule: 'resultat_annuel_4 * (1 + taux_croissance_ca)'
        format: money
      # Conservée telle quelle pour non-régression (ADR-0011 § Contrat 1 : aucune
      # ligne existante renommée ni retypée).
      - id: resultat_cumule_3ans
        label: 'Résultat cumulé sur 3 ans'
        formule: 'resultat_annuel_1 + resultat_annuel_2 + resultat_annuel_3'
        format: money
      - id: resultat_cumule_5ans
        label: 'Résultat cumulé sur 5 exercices'
        formule: 'resultat_cumule_3ans + resultat_annuel_4 + resultat_annuel_5'
        format: money

  - id: ratios
    label: 'Ratios financiers'
    lignes:
      - id: marge_ebe_pct
        label: 'Marge EBE (EBE / CA)'
        formule: 'IFERROR(excedent_brut / ca, 0)'
        format: percent
        seuil_pack: ratio_marge_ebe_min
        seuil_direction: min

      - id: marge_nette_pct
        label: 'Marge nette (Résultat / CA)'
        formule: 'IFERROR(resultat_net / ca, 0)'
        format: percent
        seuil_pack: ratio_marge_nette_min
        seuil_direction: min

      - id: dscr
        label: 'DSCR (couverture du service de la dette)'
        formule: 'IFERROR((excedent_brut * 12) / service_dette_annuel, 0)'
        format: number
        seuil_pack: ratio_dscr_min
        seuil_direction: min

      - id: tresorerie_min_ok
        label: 'Trésorerie mini sur 12 mois (vue simplifiée — voir onglet Bilan)'
        formule: 'tresorerie_min_annee_1'
        format: money
        seuil_pack: tresorerie_min_seuil
        seuil_direction: min

      - id: apport_pct
        label: 'Ratio apport personnel sur besoins'
        formule: 'IFERROR(apport_capital / pf_total_besoins, 0)'
        format: percent
        seuil_pack: ratio_apport_min_pct
        seuil_direction: min

      - id: payback_annees
        label: "Délai de récupération de l'investissement"
        formule: 'IFERROR(emprunt_capital / resultat_annuel_1, 0)'
        format: number
        seuil_pack: ratio_payback_max
        seuil_direction: max

      - id: taux_facturation_pct
        label: 'Taux de facturation'
        formule: 'IFERROR(jours_facturables_mois / 22, 0)'
        format: percent
