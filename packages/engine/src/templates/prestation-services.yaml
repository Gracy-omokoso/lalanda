# Template sectoriel : prestation de services (conseil, agence, freelance) — S6-lite.
#
# Portée : moyennes mensuelles. Modèle de facturation à la journée (T&M).
# La facturation au forfait, la mensualisation et le suivi par mission arrivent en S7.
# Fiscalité : IBP SYSCOHADA/RDC 30 %.

slug: prestation-services
version: 1.0.0
secteur: services
pays: [CD]
devise_base: USD
horizon_mois: 12

groupes_hypotheses:
  - id: activite
    label: 'Activité'
  - id: charges_fixes
    label: 'Charges fixes'
  - id: fiscalite
    label: 'Fiscalité'
  - id: financement
    label: 'Financement'

drivers:
  - id: tarif_journalier_moyen
    groupe: activite
    label: 'Tarif journalier moyen'
    type: money
    devise: USD
    defaut: 200
    min: 0
    aide: "Prix moyen d'une journée facturée à un client. Conseil / agence à Kinshasa : 150-350 USD selon expertise et positionnement."

  - id: jours_facturables_mois
    groupe: activite
    label: 'Jours facturables par mois'
    type: number
    defaut: 15
    min: 0
    max: 22
    unite: 'jours'
    aide: "Nombre de jours effectivement facturés à un client. Sur 22 jours ouvrés, un taux de facturation sain est 60-80 % (soit 13-17 jours). Le reste est absorbé par la prospection, l'administratif et la formation."

  - id: personnel_operationnel_mois
    groupe: charges_fixes
    label: 'Équipe et sous-traitance mensuelles'
    type: money
    devise: USD
    defaut: 1000
    min: 0
    aide: "Coût de l'équipe salariée et/ou des sous-traitants récurrents. À zéro pour un freelance seul."

  - id: bureau_mois
    groupe: charges_fixes
    label: 'Bureau ou coworking'
    type: money
    devise: USD
    defaut: 300
    min: 0
    aide: "Loyer d'un poste en coworking (Kin's Business Hub, Ingenious City, Silikin Village) ou petit bureau. Coworking : 150-400 USD/poste/mois."

  - id: outils_logiciels_mois
    groupe: charges_fixes
    label: 'Logiciels et abonnements'
    type: money
    devise: USD
    defaut: 150
    min: 0
    aide: 'Suite bureautique, outils métier, IA, comptabilité, stockage cloud, VPN. Ordre de grandeur pour une petite structure.'

  - id: marketing_mois
    groupe: charges_fixes
    label: 'Marketing et acquisition'
    type: money
    devise: USD
    defaut: 200
    min: 0
    aide: 'Publicité, référencement, événements, contenus. Généralement 5-10 % du CA visé.'

  - id: charges_diverses_mois
    groupe: charges_fixes
    label: "Charges d'exploitation diverses"
    type: money
    devise: USD
    defaut: 150
    min: 0
    aide: 'Télécoms, déplacements, fournitures, honoraires comptables, assurance responsabilité civile professionnelle.'

  # Voir note S9 : `ibp_taux` vient du ParameterPack du projet, `defaut` = fallback.
  - id: ibp_taux
    groupe: fiscalite
    label: 'Impôt sur les bénéfices (IBP)'
    type: percent
    defaut: 0.30
    min: 0
    max: 1
    aide: 'Taux fourni par le ParameterPack du pays. Surchargeable si le régime le justifie.'

  # ─── Financement (S11-lite) ─────────────────────────────────
  # Services = besoin d'investissement typiquement plus faible (bureau + outils).
  - id: emprunt_capital
    groupe: financement
    label: 'Capital emprunté'
    type: money
    devise: USD
    defaut: 5000
    min: 0
    aide: "Crédit d'investissement (matériel informatique, coworking, marketing initial). 0 = pas d'emprunt."

  - id: emprunt_taux_annuel
    groupe: financement
    label: "Taux d'intérêt annuel"
    type: percent
    defaut: 0.14
    min: 0
    max: 1
    aide: 'Taux nominal annuel — voir ParameterPack.'

  - id: emprunt_duree_mois
    groupe: financement
    label: 'Durée du prêt'
    type: number
    defaut: 36
    min: 1
    max: 240
    unite: 'mois'
    aide: "Durée d'amortissement. 24-48 mois typiques pour un crédit services."

  # ─── Projection pluriannuelle (S12-lite) ────────────────────
  - id: taux_croissance_ca
    groupe: activite
    label: 'Taux de croissance annuel du CA'
    type: percent
    defaut: 0.2
    min: -1
    max: 3
    aide: "Croissance annuelle du chiffre d'affaires. 20-40 % réaliste pour une agence en démarrage (montée en charge du portefeuille clients)."

  # ─── Plan de financement initial (S12b) ─────────────────────
  - id: investissements_initiaux
    groupe: financement
    label: 'Investissements initiaux'
    type: money
    devise: USD
    defaut: 6000
    min: 0
    aide: 'Matériel informatique + logiciels + coworking dépôt + identité visuelle. Pour une agence conseil : 5-10 k USD.'

  - id: bfr_initial
    groupe: financement
    label: 'Trésorerie de sécurité (BFR)'
    type: money
    devise: USD
    defaut: 4000
    min: 0
    aide: 'Trésorerie de démarrage. Services = DSO grand compte 60-90 j → prévoir 3 mois de charges fixes.'

  - id: apport_capital
    groupe: financement
    label: 'Apport personnel'
    type: money
    devise: USD
    defaut: 3500
    min: 0
    aide: 'Apport en fonds propres. ≥ 25 % du total des besoins pour être bancable.'

feuilles:
  - id: activite
    label: "Compte d'exploitation mensuel"
    lignes:
      - id: ca
        label: "Chiffre d'affaires"
        formule: 'tarif_journalier_moyen * jours_facturables_mois'
        format: money

      - id: charges_operationnelles
        label: 'Charges opérationnelles'
        formule: 'personnel_operationnel_mois + bureau_mois + outils_logiciels_mois + marketing_mois + charges_diverses_mois'
        format: money

      - id: excedent_brut
        label: "Excédent brut d'exploitation"
        formule: 'ca - charges_operationnelles'
        format: money

      - id: ibp
        label: 'Impôt sur les bénéfices'
        formule: 'IF(excedent_brut > 0, excedent_brut * ibp_taux, 0)'
        format: money

      - id: resultat_net
        label: 'Résultat net mensuel'
        formule: 'excedent_brut - ibp'
        format: money

  - id: financement
    label: 'Financement — emprunt bancaire'
    lignes:
      - id: mensualite_emprunt
        label: 'Mensualité constante'
        formule: 'IFERROR(-PMT(emprunt_taux_annuel / 12, emprunt_duree_mois, emprunt_capital), 0)'
        format: money

      - id: service_dette_annuel
        label: 'Service annuel de la dette'
        formule: 'mensualite_emprunt * 12'
        format: money

      - id: interets_annuels_estimes
        label: 'Intérêts année 1 (estimation)'
        formule: 'service_dette_annuel - (emprunt_capital / (emprunt_duree_mois / 12))'
        format: money

  # Feuille "plan_financement" (S12b) — besoins vs ressources.
  - id: plan_financement
    label: 'Plan de financement initial'
    lignes:
      - id: pf_investissements
        label: 'Investissements'
        formule: 'investissements_initiaux'
        format: money
      - id: pf_bfr
        label: 'BFR (trésorerie de sécurité)'
        formule: 'bfr_initial'
        format: money
      - id: pf_total_besoins
        label: 'TOTAL BESOINS'
        formule: 'pf_investissements + pf_bfr'
        format: money
      - id: pf_apport
        label: 'Apport personnel'
        formule: 'apport_capital'
        format: money
      - id: pf_emprunt
        label: 'Emprunt bancaire'
        formule: 'emprunt_capital'
        format: money
      - id: pf_total_ressources
        label: 'TOTAL RESSOURCES'
        formule: 'pf_apport + pf_emprunt'
        format: money
      - id: pf_ecart
        label: 'Écart (ressources − besoins)'
        formule: 'pf_total_ressources - pf_total_besoins'
        format: money

  # Feuille "projection" (S12-lite) — 3 ans avec taux de croissance annuel du CA.
  - id: projection
    label: 'Projection sur 3 ans'
    lignes:
      - id: ca_annuel_1
        label: 'CA année 1'
        formule: 'ca * 12'
        format: money
      - id: ca_annuel_2
        label: 'CA année 2'
        formule: 'ca_annuel_1 * (1 + taux_croissance_ca)'
        format: money
      - id: ca_annuel_3
        label: 'CA année 3'
        formule: 'ca_annuel_2 * (1 + taux_croissance_ca)'
        format: money
      - id: resultat_annuel_1
        label: 'Résultat net année 1'
        formule: 'resultat_net * 12'
        format: money
      - id: resultat_annuel_2
        label: 'Résultat net année 2'
        formule: 'resultat_annuel_1 * (1 + taux_croissance_ca)'
        format: money
      - id: resultat_annuel_3
        label: 'Résultat net année 3'
        formule: 'resultat_annuel_2 * (1 + taux_croissance_ca)'
        format: money
      - id: resultat_cumule_3ans
        label: 'Résultat cumulé sur 3 ans'
        formule: 'resultat_annuel_1 + resultat_annuel_2 + resultat_annuel_3'
        format: money

  - id: ratios
    label: 'Ratios financiers'
    lignes:
      - id: marge_ebe_pct
        label: 'Marge EBE (EBE / CA)'
        formule: 'IFERROR(excedent_brut / ca, 0)'
        format: percent
        seuil_pack: ratio_marge_ebe_min
        seuil_direction: min

      - id: marge_nette_pct
        label: 'Marge nette (Résultat / CA)'
        formule: 'IFERROR(resultat_net / ca, 0)'
        format: percent
        seuil_pack: ratio_marge_nette_min
        seuil_direction: min

      - id: dscr
        label: 'DSCR (couverture du service de la dette)'
        formule: 'IFERROR((excedent_brut * 12) / service_dette_annuel, 0)'
        format: number
        seuil_pack: ratio_dscr_min
        seuil_direction: min

      - id: apport_pct
        label: 'Ratio apport personnel sur besoins'
        formule: 'IFERROR(apport_capital / pf_total_besoins, 0)'
        format: percent
        seuil_pack: ratio_apport_min_pct
        seuil_direction: min

      - id: payback_annees
        label: "Délai de récupération de l'investissement"
        formule: 'IFERROR(emprunt_capital / resultat_annuel_1, 0)'
        format: number
        seuil_pack: ratio_payback_max
        seuil_direction: max

      - id: taux_facturation_pct
        label: 'Taux de facturation'
        formule: 'IFERROR(jours_facturables_mois / 22, 0)'
        format: percent
