# Comptes que l'ADR-0049 § 2.1.1 dit « à fournir par l'expert ». Aucun numéro n'est
# proposé ici ; `classHint` recopie seulement l'indication de classe donnée par l'ADR.
expectedAccounts:
  - id: mobile_money
    need: 'Monnaie électronique (mobile money)'
    classHint: '5'
    hint: 'sous-compte de la classe 5 dédié à la monnaie électronique'
    questions: [E1.1]
  - id: suspense
    need: "Comptes d'attente"
    classHint: '47'
    hint: 'compte de la classe 47'
    questions: [E1.1]
  - id: expense_categories
    need: 'Autres achats, services extérieurs, impôts et taxes, charges de personnel, frais financiers'
    classHint: '60-67'
    hint: 'comptes des classes 60 à 67, un par catégorie de dépense (ADR-0049 § 6.3)'
    questions: [E1.2]
  - id: income_tax
    need: 'Impôt sur le résultat'
    classHint: '89'
    hint: 'compte de la classe 89'
    questions: [E1.1]
  - id: fixed_assets
    need: 'Immobilisations corporelles (dépenses « investissement »)'
    classHint: '2'
    hint: 'comptes de la classe 2, selon la nature'
    questions: [E1.2]
  - id: borrowings
    need: 'Emprunts (dépenses « remboursement d’emprunt »)'
    classHint: '16'
    hint: 'compte de la classe 16'
    questions: [E1.2]
  - id: result_and_retained_earnings
    need: "Résultat de l'exercice, report à nouveau (à-nouveaux)"
    classHint: '1'
    hint: 'comptes de la classe 1'
    questions: [E1.1, E7]
  - id: exchange_differences
    need: 'Pertes et gains de change'
    classHint: null
    hint: 'décision ouverte n° 12'
    questions: [E3.3]

