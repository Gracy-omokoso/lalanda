# Pack de plan comptable — SYSCOHADA révisé, République démocratique du Congo, version 1.
#
# ADR-0049 § 2.1 et § 2.1.1 (lot K1). Statut : DRAFT.
#
# RÈGLE ABSOLUE : ce fichier ne contient AUCUN numéro, AUCUN intitulé et AUCUNE règle
# vérifiés sur le texte officiel. Les neuf classes et les dix comptes candidats sont
# repris mot pour mot de l'ADR-0049 § 2.1.1 ; chacun reste `to_confirm`, « à confirmer
# par l'expert-comptable ». Les comptes que l'ADR dit « à fournir par l'expert » ne
# figurent pas dans `accounts` : ils sont listés dans `expectedAccounts`.
#
# Les libellés des comptes sont les « besoins » décrits par l'ADR (colonne « Besoin »),
# pas les intitulés officiels du Plan comptable général OHADA, qui restent à vérifier.
#
# Le document de relecture pour l'expert-comptable reprend ce fichier en tableau :
# docs/comptabilite/relecture-pack-syscohada-v1.md (un test vérifie la concordance).

