# Pack de plan comptable — SYSCOHADA révisé, République démocratique du Congo, version 2.
#
# ADR-0049, amendement du 3 novembre 2026. Statut : APPROVED, par DÉCISION DE LA DIRIGEANTE
# (Gracy Omokoso) : « fais ce qui s'applique en RDC Congo et nous allons améliorer au fur et à
# mesure avec les experts. Aucun client n'a encore commencé à utiliser Lalanda. »
#
# Ce que cela veut dire, en clair :
# - les numéros et intitulés ci-dessous sont repris du Plan comptable général OHADA annexé à
#   l'AUDCIF du 26 janvier 2017 (SYSCOHADA révisé), tels que l'équipe les connaît ; seuls ceux
#   dont elle est sûre figurent ici. Les comptes écartés par doute sont listés dans
#   docs/comptabilite/relecture-pack-syscohada-v2.md ;
# - `confirmation: sourced` et `review` traduisent la décision de la dirigeante, PAS une relecture
#   par un expert-comptable : chaque élément porte la note « décision de la dirigeante du
#   3 nov. 2026, à revoir avec l'expert-comptable » ;
# - les états restent des projets (`draft_unverified`, bandeau « Projet — à valider par un
#   expert-comptable ») : ce pack ne change rien à cette règle ;
# - une règle `requiresReview: true` n'est jamais appliquée : sa clé va au compte d'attente 471
#   (`suspenseAccount`), avec son motif ; l'organisation peut la remplacer dans son jeu de règles.
#
# Le pack v1 reste `draft`, inchangé. Généré une fois puis relu ; le YAML seul fait foi.

