      Taux moyen estimatif. Barème réel progressif SN par tranches annuelles :
      0 %, 20 %, 30 %, 35 %, 37 %, 40 %.
    source: 'CGI SN'
    a_confirmer: true

  # ─── Ratios bancaires ────────────────────────────────────────
  ratio_dscr_min:
    valeur: 1.25
    aide: 'DSCR minimum banques UEMOA.'
  ratio_apport_min_pct:
