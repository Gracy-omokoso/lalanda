    a_confirmer: true

  # ─── Coût du crédit ──────────────────────────────────────────
  taux_credit_investissement_xof_pct:
    valeur: 0.085
    aide: 'Taux annuel moyen crédit PME XOF sous supervision BCEAO.'
    source: 'BCEAO'
    a_confirmer: true
