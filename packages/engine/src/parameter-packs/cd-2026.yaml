# ParameterPack — République Démocratique du Congo, année de référence 2026.
#
# Sources : DGI (Direction Générale des Impôts), INSS (ex-CNSS), textes SYSCOHADA
# révisés 2017, retours terrain Rawbank / Equity BCDC / PADMPME.
#
# Toute valeur marquée `a_confirmer: true` doit être re-validée avant usage bancaire
# (arrêté fiscal 2026 DGI publié en janvier, barèmes INSS actualisés à l'inflation).

slug: cd-2026
pays: CD
annee: 2026
systeme_comptable: syscohada-revise-2017
devise_principale: USD
devise_secondaire: CDF
label: 'RDC — 2026'
description: >
  Fiscalité congolaise 2026. IBP 30 %, TVA 16 %, CNSS 5 % salarié + 13 % employeur, INPP 3 %, ONEM 0,5 %.
  Devise principale USD, affichage secondaire CDF au taux BCC du jour de génération.

# Révisions en place (docs/09 § Modèle de version, erratum) : la révision 1 est
# implicite. Une révision n'est permise que pour un paramètre qu'aucun modèle ne
# consomme — sinon, une nouvelle version du pack est exigée.
revisions:
  - numero: 2
    date: '2026-10-18'
    objet: 'Taux réduit de TVA corrigé à 5 % (groupe C), taux de 1 % ajouté (groupe O), seuil d’assujettissement marqué à confirmer.'
    parametres: [tva_taux_reduit, tva_taux_reduit_1pct, tva_seuil_assujettissement_cdf]
  - numero: 3
    date: '2026-11-07'
    objet: "Charges sociales et IRPP confirmés par l'expert-comptable : CNSS employeur 13 %, INPP par tranche d'effectif, ONEM 0,5 %, IRPP en remplacement de l'IPR (ADR-0070)."
    parametres:
      [
        cnss_employeur_pct,
        cnss_salarie_pct,
        inpp_pct,
        inpp_pct_51_300,
        inpp_pct_301_plus,
        onem_pct,
        charges_sociales_employeur_pct_total,
        ipr_taux_moyen_estimatif,
        irpp_tranche_1_plafond_cdf,
        irpp_tranche_2_plafond_cdf,
        irpp_tranche_3_plafond_cdf,
        irpp_taux_tranche_1,
        irpp_taux_tranche_2,
        irpp_taux_tranche_3,
        irpp_taux_tranche_4,
      ]

avertissement: >
  Ce pack reflète les règles fiscales et sociales RDC connues à la date de rédaction.
  Certains barèmes indexés sur l'inflation (IRPP, plafond CNSS) et les taxes locales
  (patente communale) doivent être vérifiés auprès d'un expert-comptable OHADA agréé
  avant tout dépôt de dossier bancaire.

params:
  # ─── Impôt sur les bénéfices ─────────────────────────────────
  ibp_taux:
    valeur: 0.30
    aide: 'Impôt sur les Bénéfices et Profits (IBP). Taux normal sociétés.'
    source: 'Loi de finances RDC, taux constant depuis plusieurs années'
  ibp_minimum_forfaitaire_usd:
    valeur: 268
    aide: 'Minimum forfaitaire annuel (~750 000 CDF au taux BCC ~2 800 CDF/USD).'
    source: 'Code général des impôts RDC'
    a_confirmer: true

  # ─── TVA ─────────────────────────────────────────────────────
  tva_taux_normal:
    valeur: 0.16
    aide: 'TVA taux normal RDC.'
    source: 'Ordonnance-Loi 10/001 du 20/08/2010, réforme TVA'
  # Erratum (révision n° 2, ADR-0021 §7) : le taux réduit est passé de 8 % à 5 %
  # en 2026 et un taux de 1 % a été créé. Aucun modèle sectoriel ne consomme ces
  # paramètres : la correction ne change aucun plan (test verrou dans
  # parameter-packs.test.ts).
  tva_taux_reduit:
    valeur: 0.05
    aide: 'TVA taux réduit (groupe C de la facture normalisée).'
    source: 'Loi de finances 2026 ; communiqué officiel DGI n° 010 du 25 févr. 2026'
    a_confirmer: true
  tva_taux_reduit_1pct:
    valeur: 0.01
    aide: 'TVA taux réduit à 1 % (groupe O de la facture normalisée).'
    source: 'Loi de finances 2026 ; communiqué officiel DGI n° 010 du 25 févr. 2026'
    a_confirmer: true
  tva_seuil_assujettissement_cdf:
    valeur: 80000000
    aide: "Seuil annuel de chiffre d'affaires (CDF) d'assujettissement à la TVA."
    source: 'DGI, régime des micro-entrepreneurs'
    a_confirmer: true

  # ─── Charges sociales sur salaires ───────────────────────────
  # Révision n° 3 (7 nov. 2026, ADR-0070) : taux confirmé par l'expert-comptable le 7 nov. 2026.
  cnss_employeur_pct:
    valeur: 0.13
    aide: 'CNSS — part patronale sur salaires bruts : pensions 5 %, risques professionnels 1,5 %, prestations familiales 6,5 %.'
    source: "Décret n° 18/041 du 24 nov. 2018 ; confirmé par l'expert-comptable le 7 nov. 2026"
  cnss_salarie_pct:
    valeur: 0.05
    aide: 'CNSS — part salariale, précomptée sur le brut.'
    source: "Décret n° 18/041 du 24 nov. 2018 ; confirmé par l'expert-comptable le 7 nov. 2026"
  inpp_pct:
    valeur: 0.03
    aide: 'INPP — contribution patronale à la formation professionnelle, entreprise de 1 à 50 salariés.'
    source: "Loi INPP ; confirmé par l'expert-comptable le 7 nov. 2026"
  inpp_pct_51_300:
    valeur: 0.02
    aide: 'INPP — entreprise de 51 à 300 salariés.'
    source: "Loi INPP ; confirmé par l'expert-comptable le 7 nov. 2026"
  inpp_pct_301_plus:
    valeur: 0.01
    aide: 'INPP — entreprise de plus de 300 salariés.'
    source: "Loi INPP ; confirmé par l'expert-comptable le 7 nov. 2026"
  onem_pct:
    valeur: 0.005
    aide: "Office National de l'Emploi — contribution patronale."
    source: "Arrêté n° 30/CAB/MIN.ET/EAN/JDO/8/2025 (en vigueur le 5 août 2025) ; confirmé par l'expert-comptable le 7 nov. 2026"
  charges_sociales_employeur_pct_total:
    valeur: 0.165
    aide: 'Total charges sociales patronales = CNSS 13 % + INPP 3 % (1 à 50 salariés) + ONEM 0,5 %.'
    source: "confirmé par l'expert-comptable le 7 nov. 2026"

  # ─── IRPP (ex-IPR, barème progressif annuel) ─────────────────
  # Depuis le 1er janv. 2026, l'IRPP remplace l'IPR (loi n° 23/053) ; barème annuel
  # inchangé. Le prévisionnel garde un taux moyen ; le calcul exact viendra avec la
  # paie (ADR-0070).
  ipr_taux_moyen_estimatif:
    valeur: 0.15
    aide: >
      Taux moyen d'IRPP (ex-IPR) appliqué en simulation. Le barème réel est progressif
      3 % / 15 % / 30 % / 40 % par tranches annuelles.
    source: 'Loi n° 23/053 (IRPP) ; taux moyen estimatif de Lalanda, non confirmé'
    a_confirmer: true
  irpp_tranche_1_plafond_cdf:
    valeur: 1944000
    unite: 'CDF par an'
    aide: 'IRPP — plafond de la tranche à 3 %.'
    source: "Loi n° 23/053 ; confirmé par l'expert-comptable le 7 nov. 2026"
  irpp_tranche_2_plafond_cdf:
    valeur: 21600000
    unite: 'CDF par an'
    aide: 'IRPP — plafond de la tranche à 15 %.'
    source: "Loi n° 23/053 ; confirmé par l'expert-comptable le 7 nov. 2026"
  irpp_tranche_3_plafond_cdf:
    valeur: 43200000
    unite: 'CDF par an'
    aide: 'IRPP — plafond de la tranche à 30 % ; 40 % au-delà.'
    source: "Loi n° 23/053 ; confirmé par l'expert-comptable le 7 nov. 2026"
  irpp_taux_tranche_1:
    valeur: 0.03
    source: "Loi n° 23/053 ; confirmé par l'expert-comptable le 7 nov. 2026"
  irpp_taux_tranche_2:
    valeur: 0.15
    source: "Loi n° 23/053 ; confirmé par l'expert-comptable le 7 nov. 2026"
  irpp_taux_tranche_3:
    valeur: 0.30
    source: "Loi n° 23/053 ; confirmé par l'expert-comptable le 7 nov. 2026"
  irpp_taux_tranche_4:
    valeur: 0.40
    source: "Loi n° 23/053 ; confirmé par l'expert-comptable le 7 nov. 2026"

  # ─── Précompte BIC (retenue à la source fournisseurs) ────────
  precompte_bic_non_immatricule_pct:
    valeur: 0.01
    aide: 'Précompte BIC dû sur paiements à fournisseurs non immatriculés (sans NIF).'
    source: 'DGI'

  # ─── Ratios bancaires attendus (RDC / OHADA) ─────────────────
  # Ces valeurs guident les feux tricolores dans le PDF et l'UI.
  ratio_dscr_min:
    valeur: 1.25
    aide: 'Debt Service Coverage Ratio minimum attendu par les banques RDC.'
    source: 'Retours cellules PME Rawbank / BCDC'
  ratio_apport_min_pct:
    valeur: 0.25
    aide: "Ratio apport personnel / total besoins minimum pour crédit d'investissement."
    source: 'Politique de crédit Rawbank / BCDC (PADMPME exige 30 %)'
  ratio_autonomie_financiere_min:
    valeur: 0.30
    aide: 'Capitaux propres / total passif — seuil vert.'
    source: 'Standards SYSCOHADA / IFC'
  ratio_marge_ebe_min:
    valeur: 0.10
    aide: 'EBE / CA minimum — signal fort de rentabilité opérationnelle.'
    source: 'Standards analyse crédit PME'
    a_confirmer: true
  ratio_marge_nette_min:
    valeur: 0.05
    aide: 'Résultat net / CA minimum — capacité de constitution de fonds propres.'
    source: 'Standards analyse crédit PME'
    a_confirmer: true
  ratio_payback_max:
    valeur: 5
    unite: 'années'
    aide: "Délai de récupération de l'investissement maximum acceptable. Au-delà de 5 ans le dossier est jugé long ; au-delà de 7 ans il est retoqué."
    source: 'Standards analyse crédit PME RDC'
    a_confirmer: true
  tresorerie_min_seuil:
    valeur: 0
    aide: "Trésorerie minimale attendue à n'importe quel mois de l'année 1. Une trésorerie négative à un seul mois retoque le dossier — la banque vérifie systématiquement."
    source: 'Retours cellules PME Rawbank / BCDC'

  # ─── Coût du crédit constaté ─────────────────────────────────
  taux_credit_investissement_usd_pct:
    valeur: 0.14
    aide: 'Taux annuel moyen constaté sur crédit investissement PME en USD.'
    source: 'Grille tarifaire Rawbank / BCDC 2024-2025, à réactualiser 2026'
    a_confirmer: true
  taux_credit_investissement_cdf_pct:
    valeur: 0.21
    aide: 'Taux annuel moyen constaté sur crédit investissement PME en CDF.'
    source: 'Grille bancaire — plus élevé pour couvrir risque de change'
    a_confirmer: true
  taux_credit_padmpme_bonifie_pct:
    valeur: 0.095
    aide: 'Taux bonifié dispositif PADMPME (Banque Mondiale).'
    source: 'PADMPME'
    a_confirmer: true
