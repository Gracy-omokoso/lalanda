slug: hello-world
version: 1.0.0
horizon_mois: 12
drivers:
  - { id: prix_unitaire, type: number, defaut: 10 }
  - { id: quantite_mois, type: number, defaut: 100 }
  - { id: cout_variable_pct, type: percent, defaut: 0.4 }
  - { id: charges_fixes_mois, type: number, defaut: 500 }
  - { id: taux_impot, type: percent, defaut: 0.3 }
feuilles:
  - id: activite
    lignes:
      - { id: ca, formule: 'prix_unitaire * quantite_mois' }
      - { id: cout_variable, formule: 'ca * cout_variable_pct' }
      - { id: marge_brute, formule: 'ca - cout_variable' }
      - { id: resultat_avant_impot, formule: 'marge_brute - charges_fixes_mois' }
      - { id: resultat_net, formule: 'resultat_avant_impot * (1 - taux_impot)' }
