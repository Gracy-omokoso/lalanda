# Stack de production Lalanda — ADR-0009 (DigitalOcean Droplet + Caddy + Docker).
#
# Usage sur le VPS (voir scripts/deploy-vps.sh) :
#   cp .env.production.example .env.production   # puis remplir les secrets
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Topologie réseau :
#   - `edge`    : exposé via Caddy (seul service à publier 80/443).
#   - `interne` : réseau isolé (internal) — mongo/redis/minio ne sont jamais
#     joignables depuis l'extérieur, uniquement par l'API.
#
# Les images proviennent de GHCR (voir .github/workflows/deploy.yml).
# `LALANDA_TAG` épingle une version (ex: v0.2.0) ; défaut = latest.

name: lalanda-prod

# (S22e) Durcissement commun à tous les conteneurs de la pile.
#
# `no-new-privileges` neutralise setuid/setgid à l'intérieur du conteneur : une
# exécution de code dans l'API — le scénario réaliste étant une évasion du
# renderer Chromium, qui tourne avec `--no-sandbox` — ne peut plus regagner de
# privilèges par un binaire setuid. C'est la contrepartie applicative du fait
# que le conteneur api est le seul à toucher à la fois `edge` et `interne`.
#
# Le plafond de journalisation n'est pas de la sécurité au sens strict, mais un
# `json-file` sans borne remplit le disque du Droplet, et un disque plein arrête
# mongod : c'est une panne de disponibilité à part entière.
x-durcissement: &durcissement
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '5'

services:
  # ─── Reverse proxy TLS (Caddy) ────────────────────────────────────────────
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      APP_DOMAIN: '${APP_DOMAIN:?APP_DOMAIN manquant (ex app.lalanda.example)}'
      API_DOMAIN: '${API_DOMAIN:?API_DOMAIN manquant (ex api.lalanda.example)}'
      ACME_EMAIL: "${ACME_EMAIL:?ACME_EMAIL manquant (contact Let's Encrypt)}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge
    <<: *durcissement
    mem_limit: 256m
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      # `127.0.0.1` et NON `localhost` : dans l'image alpine, `localhost` résout
      # d'abord en IPv6 `[::1]`, alors que l'API d'administration de Caddy
      # n'écoute qu'en IPv4. Le contrôle échouait donc en permanence
      # (« connection refused ») pendant que le site servait normalement — un
      # contrôle de santé qui rapporte rouge sur un service sain est pire que
      # pas de contrôle : il apprend à ignorer l'alerte.
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:2019/metrics']
      interval: 30s
      timeout: 5s
      retries: 3

  # ─── Web (Next.js standalone) ─────────────────────────────────────────────
  web:
    image: ghcr.io/gracy-omokoso/lalanda-web:${LALANDA_TAG:-latest}
    restart: unless-stopped
    # (S22e) PLUS de `env_file: .env.production` ici. Le front n'a besoin que de
    # trois variables non secrètes (vérifié : `process.env` n'apparaît que dans
    # health/route.ts, lib/api.ts et lib/auth-client.ts, toutes pour
    # NEXT_PUBLIC_API_URL). Le fichier complet lui donnait AUTH_SECRET,
    # OPENAI_API_KEY, S3_SECRET_KEY et MONGODB_URI — de quoi forger une session
    # de n'importe quelle organisation depuis n'importe quelle SSRF ou page
    # d'erreur bavarde de Next, pour aucun bénéfice fonctionnel.
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WEB_URL: ${WEB_URL:?WEB_URL manquant}
      # Lue à l'exécution par apps/web/src/app/health/route.ts (le stage runtime
      # de apps/web/Dockerfile ne la porte pas, seul le stage de build l'inline
      # dans le bundle client).
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL manquant}
    networks:
      - edge
    <<: *durcissement
    mem_limit: 512m
    # Le healthcheck est défini dans l'image (HEALTHCHECK /health).

  # ─── API (NestJS) ─────────────────────────────────────────────────────────
  api:
    image: ghcr.io/gracy-omokoso/lalanda-api:${LALANDA_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env.production
    networks:
      # (S22f, F-03) Cette ligne est le troisième maillon de la chaîne de
      # confiance du reverse proxy : l'API règle `trust proxy = 1` — UN seul
      # rang — et cette affirmation n'est vraie que parce que `edge` ne publie
      # que les ports de caddy. Aucun autre client ne peut atteindre :3001
      # directement, donc aucun ne peut se présenter avec un `X-Forwarded-For`
      # qui court-circuiterait le rang de confiance. Publier ce port, ou glisser
      # un proxy supplémentaire devant caddy, invalide le réglage de l'API :
      # voir apps/api/src/security/trusted-proxy.ts.
      - edge # joignable par Caddy
      - interne # accès mongo/redis/minio
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    <<: *durcissement
    # (S22e) Borne mémoire OBLIGATOIRE ici, pas cosmétique : le conteneur api
    # lance Chromium pour chaque export PDF. Le portillon de `reports/` borne
    # désormais la concurrence côté applicatif, mais un conteneur sans
    # `mem_limit` sur un Droplet unique laisse l'OOM killer de l'hôte arbitrer —
    # et il emporte statistiquement le plus gros processus, c'est-à-dire mongod.
    # Avec une limite, c'est l'API qui meurt et redémarre : la base survit.
    mem_limit: 1500m
    # Chromium éclate en une dizaine de processus par rendu; un emballement doit
    # buter sur une borne avant d'épuiser la table des processus de l'hôte.
    pids_limit: 512
    # Le healthcheck est défini dans l'image (HEALTHCHECK /health, état Mongo inclus).

  # ─── MongoDB replica set rs0 (ADR-0004 : transactions) ────────────────────
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    command: ['--replSet', 'rs0', '--bind_ip_all', '--port', '27017']
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    networks:
      - interne
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "db.adminCommand('ping').ok"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    <<: *durcissement
    mem_limit: 1g

  mongo-init:
    image: mongo:7.0
    depends_on:
      mongo:
        condition: service_healthy
    restart: 'no'
    networks:
      - interne
    entrypoint:
      - bash
      - -c
      - |
        mongosh --host mongo:27017 --quiet --eval '
          try {
            const status = rs.status();
            print("Replica set déjà initialisé : " + status.set);
          } catch (err) {
            if (err.codeName === "NotYetInitialized") {
              rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongo:27017" }] });
              print("Replica set rs0 initialisé.");
            } else {
              throw err;
            }
          }
        '

  # ─── Redis (BullMQ) ───────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    networks:
      - interne
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    <<: *durcissement
    mem_limit: 256m

  # ─── Stockage objet (MinIO en attendant la bascule DO Spaces) ─────────────
  # ADR-0009 vise DigitalOcean Spaces ; MinIO fournit la même API S3 sur le
  # Droplet tant que les credentials Spaces ne sont pas provisionnés.
  minio:
    # (S22e) `latest` figé : une image de stockage objet qui change sous les
    # pieds d'un `docker compose pull` est un changement non revu en production.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY manquant}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY manquant}
    volumes:
      - minio-data:/data
    networks:
      - interne
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 15s
      timeout: 5s
      retries: 5
    <<: *durcissement
    mem_limit: 512m

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    restart: 'no'
    networks:
      - interne
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?}
      S3_BUCKET_EXPORTS: ${S3_BUCKET_EXPORTS:-lalanda-exports}
      S3_BUCKET_SNAPSHOTS: ${S3_BUCKET_SNAPSHOTS:-lalanda-snapshots}
      S3_BUCKET_UPLOADS: ${S3_BUCKET_UPLOADS:-lalanda-uploads}
    entrypoint:
      - sh
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"
        mc mb --ignore-existing "local/$$S3_BUCKET_EXPORTS"
        mc mb --ignore-existing "local/$$S3_BUCKET_SNAPSHOTS"
        mc mb --ignore-existing "local/$$S3_BUCKET_UPLOADS"
        echo "Buckets MinIO prêts."

networks:
  edge:
    driver: bridge
  interne:
    driver: bridge
    internal: true # aucun accès sortant/entrant hors du réseau Docker

volumes:
  caddy-data: # certificats TLS Let's Encrypt — à sauvegarder
  caddy-config:
  mongo-data:
  mongo-config:
  redis-data:
  minio-data:
